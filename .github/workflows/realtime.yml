name: Sync realtime parking data

on:
  schedule:
    # 매 10분마다 (분 단위는 GitHub Actions 부하 상황에 따라 5~15분 지연 가능)
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch realtime parking data
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        run: python scripts/fetch_realtime.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/realtime.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/realtime.json
            git commit -m "chore: realtime parking ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "realtime updated"
          else
            echo "no change"
          fi
