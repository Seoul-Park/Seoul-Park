name: Sync parking data

on:
  schedule:
    # 매주 월요일 오전 4시 KST (= 일요일 19시 UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper for all active districts
        run: python scripts/scrape.py all

      - name: Commit changes (if any)
        run: |
          if [ -n "$(git status --porcelain data/lots/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/lots/
            git commit -m "chore: sync parking data ($(date -u +%Y-%m-%d))"
            git push
            echo "Data updated and pushed"
          else
            echo "No changes - nothing to commit"
          fi
