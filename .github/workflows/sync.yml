name: Sync parking data

on:
  schedule:
    # 매주 월요일 오전 4시 KST (= 일요일 19시 UTC)
    - cron: '0 19 * * 0'
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync 구로구 시설공단 + 서울 API
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        run: python scripts/scrape.py all

      - name: Sync 표준데이터 (22개 구 공영주차장)
        run: python scripts/scrape_standard.py all

      - name: Sync GetParkInfo (서울 통합 공영 신규)
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        run: python scripts/scrape_parkinfo.py

      - name: Sync 성동구도시관리공단 공영주차장
        run: python scripts/scrape_seongdong.py

      - name: Sync 공유누리 공유주차장 (서울)
        run: python scripts/scrape_eshare.py

      - name: Sync 거주자우선주차 (16개 구)
        run: python scripts/scrape_residential.py all

      - name: Commit changes (if any)
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: sync parking data ($(date -u +%Y-%m-%d))"
            git push
            echo "Data updated and pushed"
          else
            echo "No changes - nothing to commit"
          fi
