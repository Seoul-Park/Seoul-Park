    // ───────────── 메인 ─────────────
    (async function main() {
      const statusEl = document.getElementById('status');
      const selectEl = document.getElementById('districtSelect');
      const listEl = document.getElementById('list');
      const subEl = document.getElementById('subText');
      const updatedAtEl = document.getElementById('updatedAt');
      const mapContainer = document.getElementById('map');
      const listCountEl = document.getElementById('listCount');
      const sortLabelEl = document.getElementById('sortLabel');

      // districts
      let districtsData;
      try {
        const res = await fetch('./data/districts.json?_=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        districtsData = await res.json();
      } catch (e) {
        statusEl.textContent = '구 목록 로드 실패: ' + e.message;
        return;
      }
      const districts = districtsData.districts;
      const districtByCode = new Map(districts.map(d => [d.code, d]));
      selectEl.innerHTML = districts.map(d => {
        const label = d.active ? d.name : `${d.name} (준비 중)`;
        return `<option value="${d.code}" ${d.active ? '' : 'disabled'}>${label}</option>`;
      }).join('');

      const hashCode = location.hash.replace('#', '');
      const initialCode = (hashCode && districtByCode.get(hashCode))
        ? hashCode
        : 'guro';  // 첫 로드 fallback (geolocation 결과 오면 자동 전환)

      kakao.maps.load(() => {
        const map = new kakao.maps.Map(mapContainer, {
          center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7
        });

        const state = {
          markers: [], chipOverlays: [],
          clusterer: null,
          openCardOverlay: null,
          lotById: new Map(),
          lots: [],
          districtCode: null,
          category: 'public',  // 첫 진입은 공영주차장
          mapEmptyEl: null,
          origin: null,         // { name, lat, lng, overlay }
          destination: null,    // { name, lat, lng, overlay }
          waypoints: [],        // [{ id, name, lat, lng, overlay, row }]
          routePolyline: null,
          routeLabel: null,
          routePathCoords: null,   // [[lat,lng], ...] 경로 좌표 캐시
          districtName: '',        // renderList 재호출용
          // 리스트 hover로 이동했을 때 마우스가 벗어나면 복귀할 위치
          savedView: null,         // { center: LatLng, level: number }
          userMovedMap: false,     // 사용자가 hover 중 지도를 직접 움직였는지
        };
        const MAX_WAYPOINTS = 3;

        function clearState() {
          if (state.openCardOverlay) { state.openCardOverlay.setMap(null); state.openCardOverlay = null; }
          state.markers.forEach(m => m.setMap(null));
          state.chipOverlays.forEach(o => o.setMap(null));
          state.markers = []; state.chipOverlays = [];
          if (state.clusterer) { state.clusterer.clear(); }
          state.lotById.clear(); state.lots = [];
          if (state.mapEmptyEl) { state.mapEmptyEl.remove(); state.mapEmptyEl = null; }
          clearRoute();
          // 경유지 정리 (구 변경 시 유지하고 싶다면 이 줄 빼기)
        }

        function clearRoute() {
          if (state.routePolyline) { state.routePolyline.setMap(null); state.routePolyline = null; }
          if (state.routeLabel) { state.routeLabel.setMap(null); state.routeLabel = null; }
          state.routePathCoords = null;
        }

        function minDistMToPath(lat, lng, coords) {
          let min = Infinity;
          for (let i = 0; i < coords.length; i++) {
            const [plat, plng] = coords[i];
            const d = haversineMeters({ lat, lng }, { lat: plat, lng: plng });
            if (d < min) { min = d; if (min < 50) break; }
          }
          return min;
        }

        function applyMapVisibility(visibleLotIds) {
          const isFiltered = visibleLotIds !== null;
          const visSet = visibleLotIds ? new Set(visibleLotIds) : null;
          state.markers.forEach(m => {
            const v = !isFiltered || visSet.has(m._lotId);
            // 클러스터러는 별도 처리: 일단 클러스터러에서 제거
            if (v) m.setMap(state.clusterer ? null : map);  // 클러스터러가 있으면 add로 보여줌
            else m.setMap(null);
          });
          state.chipOverlays.forEach(o => {
            const v = !isFiltered || visSet.has(o._lotId);
            o.setMap(v ? map : null);
          });
          if (state.clusterer) {
            state.clusterer.clear();
            const visMarkers = state.markers.filter(m => !isFiltered || visSet.has(m._lotId));
            // 필터링 적용 시 (visible 수가 적으면) 클러스터러 우회하고 직접 표시
            if (isFiltered && visMarkers.length <= 50) {
              visMarkers.forEach(m => m.setMap(map));
            } else {
              state.clusterer.addMarkers(visMarkers);
            }
          }
        }

        // ─── 위치 권한 ───
        let locationConsent = null;  // null=미결정, true=동의, false=비동의
        let _locationPromise = null;
        let _locationResolve = null;

        function showLocationConsent() {
          // 한 번만 결정. 이미 결정됐으면 그 값 반환.
          if (locationConsent !== null) return Promise.resolve(locationConsent);
          if (_locationPromise) return _locationPromise;
          _locationPromise = new Promise((res) => { _locationResolve = res; });
          document.getElementById('locModal').classList.add('show');
          return _locationPromise;
        }

        // 헤더의 위치 설정 버튼 - 언제든 모달 다시 띄움
        document.getElementById('locSettingsBtn').addEventListener('click', () => {
          locationConsent = null;
          _locationPromise = null;
          _locationResolve = null;
          document.getElementById('locModal').classList.add('show');
        });

        document.getElementById('locAllow').addEventListener('click', () => {
          locationConsent = true;
          document.getElementById('locModal').classList.remove('show');
          if (_locationResolve) { _locationResolve(true); _locationResolve = null; _locationPromise = null; }
        });
        document.getElementById('locDeny').addEventListener('click', () => {
          locationConsent = false;
          document.getElementById('locModal').classList.remove('show');
          // 위치 관련 UI 비활성화
          const btn = document.getElementById('useCurrentBtn');
          if (btn) { btn.disabled = true; btn.title = '위치 사용에 동의하지 않음'; }
          if (_locationResolve) { _locationResolve(false); _locationResolve = null; _locationPromise = null; }
        });

        // 모든 geolocation 호출의 게이트키퍼
        async function tryGeolocation(onPos, onFail, opts) {
          const ok = await showLocationConsent();
          if (!ok || !navigator.geolocation) {
            onFail && onFail({ code: 1, message: 'denied by user or unsupported' });
            return;
          }
          navigator.geolocation.getCurrentPosition(onPos, onFail || (() => {}), opts || { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
        }

        function showUserLocationMarker(lat, lng) {
          if (state.userLocOverlay) state.userLocOverlay.setMap(null);
          state.userLocOverlay = new kakao.maps.CustomOverlay({
            content: '<div class="user-loc-pulse"></div>',
            position: new kakao.maps.LatLng(lat, lng),
            yAnchor: 0.5, xAnchor: 0.5, zIndex: 65,
          });
          state.userLocOverlay.setMap(map);
        }

        // 공용: "내 위치로 이동" 효과 (지도를 GPS 위치 중심 + 줌 4로 부드럽게)
        function applyLocateView(lat, lng) {
          state.userLocation = { lat, lng };  // 마지막 GPS 위치 보존
          showUserLocationMarker(lat, lng);
          if (map.getLevel() !== 4) map.setLevel(4);
          map.panTo(new kakao.maps.LatLng(lat, lng));
          // 이동 끝난 직후 마커 이미지 업데이트 (panTo 약 500ms)
          setTimeout(updateMarkerVisuals, 600);
        }

        // 현재 뷰포트 기준으로 마커 이미지를 큰핀/작은점으로 동적 변경
        // (보이는 화면 안 주차장: 큰 P 핀 상시표시 / 바깥: 작은 동그라미)
        function updateMarkerVisuals() {
          if (!state.markers || state.markers.length === 0) return;
          const bounds = map.getBounds();
          state.markers.forEach(marker => {
            if (!marker._bigImg || !marker._smallImg) return;
            const inside = bounds.contain(marker.getPosition());
            marker.setImage(inside ? marker._bigImg : marker._smallImg);
          });
        }

        // 지도 이동/줌 끝나면 마커 이미지 다시 업데이트 (drag·zoom 완료 시점)
        let visualsTimer = null;
        const scheduleVisualsUpdate = () => {
          if (visualsTimer) clearTimeout(visualsTimer);
          visualsTimer = setTimeout(updateMarkerVisuals, 150);
        };
        kakao.maps.event.addListener(map, 'idle', scheduleVisualsUpdate);
        kakao.maps.event.addListener(map, 'zoom_changed', scheduleVisualsUpdate);

        // 지도 우하단 "내 위치로 이동" 버튼
        const mapLocateBtn = document.getElementById('mapLocateBtn');
        if (mapLocateBtn) {
          mapLocateBtn.addEventListener('click', () => {
            mapLocateBtn.classList.add('locating');
            tryGeolocation(
              (pos) => {
                mapLocateBtn.classList.remove('locating');
                applyLocateView(pos.coords.latitude, pos.coords.longitude);
              },
              (err) => {
                mapLocateBtn.classList.remove('locating');
                if (err && err.code !== 1) {
                  alert('현재 위치를 가져올 수 없습니다.\n잠시 후 다시 시도해주세요.');
                }
                // code 1 (denied) 는 동의 모달에서 이미 안내했으므로 조용히 종료
              },
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
            );
          });
        }

        // ─── 거리뷰 모달 ───
        const rvModal = document.getElementById('rvModal');
        const rvContainer = document.getElementById('rvContainer');
        const rvTitle = document.getElementById('rvTitle');
        let _roadview = null;
        function openRoadview(lat, lng, title) {
          const pos = new kakao.maps.LatLng(lat, lng);
          new kakao.maps.RoadviewClient().getNearestPanoId(pos, 100, (panoId) => {
            if (!panoId) { alert('이 위치 근처에 거리뷰가 없습니다.'); return; }
            rvTitle.textContent = title || '';
            rvModal.classList.add('show');
            if (!_roadview) _roadview = new kakao.maps.Roadview(rvContainer);
            _roadview.setPanoId(panoId, pos);
            setTimeout(() => _roadview.relayout && _roadview.relayout(), 100);
          });
        }
        document.getElementById('rvClose').addEventListener('click', () => rvModal.classList.remove('show'));
        rvModal.addEventListener('click', (e) => { if (e.target === rvModal) rvModal.classList.remove('show'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') rvModal.classList.remove('show'); });

        function reverseGeocode(lat, lng, cb) {
          try {
            new kakao.maps.services.Geocoder().coord2Address(lng, lat, (result, status) => {
              if (status === kakao.maps.services.Status.OK && result && result[0]) {
                const road = result[0].road_address?.address_name;
                const jibun = result[0].address?.address_name;
                cb(road || jibun || '현재 위치');
              } else {
                cb('현재 위치');
              }
            });
          } catch (e) {
            cb('현재 위치');
          }
        }

        // ─── 카카오 모빌리티 도로 경로 ───
        const KAKAO_REST_KEY = 'e369007f7234d41ce977746bcd1fb224';
        const routeCache = new Map();
        let routeRequestId = 0;

        async function fetchKakaoRoute(o, d, waypoints) {
          const validWps = (waypoints || []).filter(w => w.lat != null && w.lng != null);
          const wpParam = validWps.length
            ? '&waypoints=' + validWps.map(w => `${w.lng},${w.lat}`).join('|')
            : '';
          const url = `https://apis-navi.kakaomobility.com/v1/directions?origin=${o.lng},${o.lat}&destination=${d.lng},${d.lat}&priority=RECOMMEND${wpParam}`;
          const res = await fetch(url, {
            headers: { Authorization: `KakaoAK ${KAKAO_REST_KEY}` }
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const route = data.routes?.[0];
          if (!route || route.result_code !== 0) throw new Error(route?.result_msg || 'No route');
          const path = [];
          for (const section of route.sections || []) {
            for (const road of section.roads || []) {
              const v = road.vertexes || [];
              for (let i = 0; i < v.length; i += 2) {
                path.push(new kakao.maps.LatLng(v[i + 1], v[i]));
              }
            }
          }
          return {
            path,
            distanceM: route.summary.distance,
            durationS: route.summary.duration,
            taxiFare: route.summary.fare?.taxi || 0,
            tollFare: route.summary.fare?.toll || 0,
          };
        }

        function drawRoute(path, label, midLatLng) {
          state.routePolyline = new kakao.maps.Polyline({
            path,
            strokeWeight: 5,
            strokeColor: '#3182F6',
            strokeOpacity: 0.9,
            strokeStyle: 'solid',
          });
          state.routePolyline.setMap(map);

          state.routeLabel = new kakao.maps.CustomOverlay({
            content: `<div class="route-label">${label}</div>`,
            position: midLatLng,
            yAnchor: 0.5, xAnchor: 0.5,
            zIndex: 60,
          });
          state.routeLabel.setMap(map);

          const bounds = new kakao.maps.LatLngBounds();
          path.forEach(pt => bounds.extend(pt));
          map.setBounds(bounds, 80, 80, 80, 80);

          // 경로 좌표 캐시 (점 너무 많으면 샘플링)
          const step = Math.max(1, Math.floor(path.length / 200));
          const coords = [];
          for (let i = 0; i < path.length; i += step) {
            coords.push([path[i].getLat(), path[i].getLng()]);
          }
          // 마지막 점 보장
          if (coords[coords.length - 1] !== path[path.length - 1]) {
            const last = path[path.length - 1];
            coords.push([last.getLat(), last.getLng()]);
          }
          state.routePathCoords = coords;
          if (state.districtName) renderList(state.districtName);
        }

        async function updateRoute() {
          clearRoute();
          if (!state.origin || !state.destination) return;
          const o = state.origin, d = state.destination;
          const midLatLng = new kakao.maps.LatLng((o.lat + d.lat) / 2, (o.lng + d.lng) / 2);

          // 로딩 라벨 즉시 표시
          state.routeLabel = new kakao.maps.CustomOverlay({
            content: `<div class="route-label"><span class="est">경로 계산 중…</span></div>`,
            position: midLatLng,
            yAnchor: 0.5, xAnchor: 0.5,
            zIndex: 60,
          });
          state.routeLabel.setMap(map);

          const validWps = state.waypoints.filter(w => w.lat != null && w.lng != null);
          const wpKeyPart = validWps.map(w => `${w.lng.toFixed(5)},${w.lat.toFixed(5)}`).join('|');
          const key = `${o.lng.toFixed(5)},${o.lat.toFixed(5)}|${wpKeyPart}|${d.lng.toFixed(5)},${d.lat.toFixed(5)}`;
          const reqId = ++routeRequestId;

          try {
            let route = routeCache.get(key);
            if (!route) {
              route = await fetchKakaoRoute(o, d, validWps);
              routeCache.set(key, route);
            }
            if (reqId !== routeRequestId) return;

            clearRoute();
            const min = Math.max(1, Math.round(route.durationS / 60));
            const label = `<span class="km">${formatDistance(route.distanceM)}</span><span class="est">· 약 ${min}분</span>`;
            drawRoute(route.path, label, midLatLng);
          } catch (e) {
            if (reqId !== routeRequestId) return;
            console.warn('도로 경로 실패, 직선으로 대체:', e.message);
            clearRoute();
            const path = [new kakao.maps.LatLng(o.lat, o.lng), new kakao.maps.LatLng(d.lat, d.lng)];
            const distM = haversineMeters({ lat: o.lat, lng: o.lng }, { lat: d.lat, lng: d.lng });
            const label = `<span class="km">${formatDistance(distM)}</span><span class="est">· 직선거리</span>`;
            // 직선용 점선
            state.routePolyline = new kakao.maps.Polyline({
              path, strokeWeight: 4, strokeColor: '#3182F6', strokeOpacity: 0.7, strokeStyle: 'shortdash',
            });
            state.routePolyline.setMap(map);
            state.routeLabel = new kakao.maps.CustomOverlay({
              content: `<div class="route-label">${label}</div>`,
              position: midLatLng, yAnchor: 0.5, xAnchor: 0.5, zIndex: 60,
            });
            state.routeLabel.setMap(map);
            const bounds = new kakao.maps.LatLngBounds();
            path.forEach(pt => bounds.extend(pt));
            map.setBounds(bounds, 80, 80, 80, 80);
            state.routePathCoords = [[o.lat, o.lng], [d.lat, d.lng]];
            if (state.districtName) renderList(state.districtName);
          }
        }

        function showMapEmpty(district) {
          const div = document.createElement('div');
          div.className = 'map-empty';
          div.innerHTML = `
            <div class="icon">🚧</div>
            <div class="title">${escapeHtml(district.name)} 데이터 준비 중</div>
            <div class="msg">아직 ${escapeHtml(district.name)} 데이터가 추가되지 않았습니다.<br>다른 구를 선택하거나, 추후 업데이트를 기다려주세요.</div>
          `;
          mapContainer.appendChild(div);
          state.mapEmptyEl = div;
        }

        function setActiveItem(lotId) {
          document.querySelectorAll('.list-item').forEach(el => {
            el.classList.toggle('active', el.dataset.lotId === lotId);
          });
        }

        function openCard(lot) {
          if (state.openCardOverlay) state.openCardOverlay.setMap(null);
          const overlay = new kakao.maps.CustomOverlay({
            content: buildCard(lot), position: lot._coords,
            yAnchor: 1.18, zIndex: 100,
            clickable: true  // 카드 안 클릭이 지도에 안 흘러가게 (핸들러 정상 동작)
          });
          overlay.setMap(map);
          state.openCardOverlay = overlay;
        }
        // 카드 내 버튼 이벤트 위임 — 단순 셀렉터 + 디버그 로그
        document.addEventListener('click', (e) => {
          const t = e.target;
          if (t.closest('.set-dest')) {
            const btn = t.closest('.set-dest');
            const id = btn.dataset.lotId;
            const lot = state.lotById.get(id);
            console.log('[카드 경로검색]', { id, lot, hasLot: !!lot, name: lot?.name, lat: lot?.lat, lng: lot?.lng });
            if (lot) {
              setDestAndAutoOrigin({ name: cleanLotName(lot.name), lat: lot.lat, lng: lot.lng });
              console.log('[setDestAndAutoOrigin 호출 후]', { destInput: document.getElementById('destInput').value, hasDest: !!state.destination });
            } else {
              console.warn('[lot 못 찾음] state.lotById 크기:', state.lotById.size, '키 목록:', Array.from(state.lotById.keys()).slice(0, 5));
            }
            if (state.openCardOverlay) { state.openCardOverlay.setMap(null); state.openCardOverlay = null; }
            return;
          }
          if (t.closest('.card-kakao-nav')) {
            const lot = state.lotById.get(t.closest('.card-kakao-nav').dataset.lotId);
            if (lot) openKakaoNav({ name: cleanLotName(lot.name), lat: lot.lat, lng: lot.lng });
            return;
          }
          if (t.closest('.card-tmap-nav')) {
            const lot = state.lotById.get(t.closest('.card-tmap-nav').dataset.lotId);
            if (lot) openTmap({ name: cleanLotName(lot.name), lat: lot.lat, lng: lot.lng });
            return;
          }
          if (t.closest('.card-roadview')) {
            const lot = state.lotById.get(t.closest('.card-roadview').dataset.lotId);
            if (lot) openRoadview(lot.lat, lot.lng, cleanLotName(lot.name));
            return;
          }
          if (t.closest('.card .close')) {
            if (state.openCardOverlay) { state.openCardOverlay.setMap(null); state.openCardOverlay = null; }
            return;
          }
        });

        function focusLot(lot) {
          if (!lot._coords) return;
          map.panTo(lot._coords);
          setActiveItem(lot._id);
          openCard(lot);
        }

        kakao.maps.event.addListener(map, 'click', () => {
          if (state.openCardOverlay) { state.openCardOverlay.setMap(null); state.openCardOverlay = null; }
        });

        // 지도 칩 클릭 = 상세 카드 (경로는 카드 내 '경로검색' 버튼으로)
        document.addEventListener('click', (e) => {
          const chipWrap = e.target.closest('.chip-wrap');
          if (chipWrap) {
            const lot = state.lotById.get(chipWrap.dataset.lotId);
            if (lot) focusLot(lot);
          }
        });
        // 좌측 리스트 클릭 = 상세 카드 (정보 확인용)
        listEl.addEventListener('click', (e) => {
          const item = e.target.closest('.list-item');
          if (!item) return;
          const lot = state.lotById.get(item.dataset.lotId);
          if (lot) focusLot(lot);
        });
        // 좌측 리스트 호버 = 지도 이동 + 적당히 확대 (디바운스 200ms)
        // 마우스가 리스트 영역에서 벗어나면 호버 직전 위치로 복귀
        // 단, 호버 도중 사용자가 지도를 직접 움직였다면 복귀 안 함
        let hoverTimer = null;
        let restoringView = false;  // 우리가 복귀 중일 때 dragstart 무시용

        // 카카오맵 panTo는 거리가 한 화면 분량 이상이면 즉시 전환됨.
        // 항상 부드럽게 이동시키기 위해 거리에 따라 줌아웃 → panTo → 줌인 시퀀스 적용
        function smoothPanTo(targetCoords, finalLevel = 4) {
          const currentCenter = map.getCenter();
          // 두 점 사이 거리(m) 측정
          const distM = new kakao.maps.Polyline({ path: [currentCenter, targetCoords] }).getLength();
          // 거리별 적정 중간 줌 (값이 클수록 더 넓게 보임)
          let interLv = finalLevel;
          if (distM > 8000)      interLv = 9;
          else if (distM > 4000) interLv = 8;
          else if (distM > 2000) interLv = 7;
          else if (distM > 1000) interLv = 6;
          else if (distM > 500)  interLv = 5;

          if (interLv > map.getLevel()) {
            // 줌아웃 → panTo → 줌인
            map.setLevel(interLv);
            map.panTo(targetCoords);
            setTimeout(() => {
              if (map.getLevel() !== finalLevel) map.setLevel(finalLevel, { anchor: targetCoords });
            }, 500);
          } else {
            // 이미 충분히 줌아웃 상태 → 바로 panTo + 줌인
            map.panTo(targetCoords);
            setTimeout(() => {
              if (map.getLevel() !== finalLevel) map.setLevel(finalLevel, { anchor: targetCoords });
            }, 500);
          }
        }

        listEl.addEventListener('mouseover', (e) => {
          const item = e.target.closest('.list-item');
          if (!item) return;
          if (hoverTimer) clearTimeout(hoverTimer);
          hoverTimer = setTimeout(() => {
            const lot = state.lotById.get(item.dataset.lotId);
            if (!lot || !lot._coords) return;
            // 첫 호버 직전 지도 상태를 저장 (이미 저장돼 있으면 유지)
            if (!state.savedView) {
              state.savedView = { center: map.getCenter(), level: map.getLevel() };
              state.userMovedMap = false;
            }
            restoringView = true;
            smoothPanTo(lot._coords, 4);
            setTimeout(() => { restoringView = false; }, 1000);
          }, 200);
        });
        listEl.addEventListener('mouseout', (e) => {
          // 다른 항목으로 빠르게 옮길 때 타이머 취소
          if (e.target.closest('.list-item') && !e.relatedTarget?.closest('.list-item')) {
            if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
          }
        });
        // 리스트 영역 전체에서 마우스가 벗어나면 원위치 복귀 (부드러운 이동)
        // 단, 클릭으로 안내 카드를 열어둔 상태면 그 주차장 위치 유지 (복귀 안 함)
        listEl.addEventListener('mouseleave', () => {
          if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
          if (state.openCardOverlay) {
            // 카드가 열려 있으면 현재 위치(클릭한 주차장)에 그대로 머묾
            state.savedView = null;
            state.userMovedMap = false;
            return;
          }
          if (state.savedView && !state.userMovedMap) {
            restoringView = true;
            // smoothPanTo로 부드럽게 복귀 (거리 멀어도 화면전환 없이)
            smoothPanTo(state.savedView.center, state.savedView.level ?? map.getLevel());
            setTimeout(() => { restoringView = false; }, 1000);
          }
          state.savedView = null;
          state.userMovedMap = false;
        });
        // 사용자가 지도를 직접 드래그하면 → 복귀 안 함
        kakao.maps.event.addListener(map, 'dragstart', () => {
          if (restoringView) return;  // 우리가 복귀 중일 때는 무시
          if (state.savedView) state.userMovedMap = true;
        });

        // ─── 거리 / 정렬 / 리스트 ───
        function renderList(districtName) {
          state.districtName = districtName;
          let lots = state.lots.slice();
          let mode = 'default';

          const hasRoute = state.routePathCoords && state.routePathCoords.length >= 2;
          const ROUTE_RADIUS_M = 1000;

          if (state.destination) {
            // 도착지 있으면 무조건 도착지 기준 1km 필터 + 거리순
            const dest = state.destination;
            lots.forEach(l => {
              l._distance = haversineMeters({ lat: l.lat, lng: l.lng }, dest);
              l._distToPath = null;
            });
            lots = lots.filter(l => l._distance <= ROUTE_RADIUS_M);
            lots.sort((a, b) => a._distance - b._distance);
            mode = 'destination';
          } else {
            lots.forEach(l => { l._distance = null; l._distToPath = null; });
          }

          // 지도 마커도 같은 필터 적용
          applyMapVisibility(mode === 'destination' ? lots.map(l => l._id) : null);

          // 헤더 표시
          if (mode === 'destination') {
            listCountEl.textContent = `도착지 1km 내 ${lots.length}곳`;
            sortLabelEl.textContent = '도착지 가까운 순';
            sortLabelEl.style.display = '';
          } else {
            listCountEl.textContent = `주차장 ${lots.length}곳`;
            sortLabelEl.style.display = 'none';
          }

          listEl.innerHTML = lots.length
            ? lots.map(l => buildListItem(l, districtName)).join('')
            : '<div class="list-empty">' + (mode === 'destination' ? '도착지 1km 내 주차장이 없어요.' : '표시할 주차장이 없어요.') + '</div>';
        }

        // ─── 자동완성 (카카오 Places) ───
        const placesService = new kakao.maps.services.Places();

        function setupAutocomplete(inputEl, dropdownEl, rowEl, onPick) {
          const fire = debounce((q) => {
            if (!q || q.length < 2) { dropdownEl.classList.remove('show'); return; }
            // 1차: 지도 중심에서 20km 내 정확도순 검색
            placesService.keywordSearch(q, (data, status) => {
              if (status === kakao.maps.services.Status.OK && data.length > 0) {
                showResults(data);
                return;
              }
              // 2차: 범위 제거하고 전국 검색
              placesService.keywordSearch(q, (data2, status2) => {
                if (status2 !== kakao.maps.services.Status.OK || data2.length === 0) {
                  dropdownEl.innerHTML = '<div class="ac-empty">검색 결과 없음</div>';
                  dropdownEl.classList.add('show');
                  return;
                }
                showResults(data2);
              });
            }, { location: map.getCenter(), radius: 20000, sort: 'accuracy' });

            function showResults(data) {
              const items = data.slice(0, 8);
              dropdownEl.innerHTML = items.map((p, i) => `
                <div class="ac-item" data-i="${i}">
                  <div class="ac-name">${escapeHtml(p.place_name)}</div>
                  <div class="ac-addr">${escapeHtml(p.road_address_name || p.address_name || '')}</div>
                </div>
              `).join('');
              dropdownEl.classList.add('show');
              dropdownEl._items = items;
            }
          }, 220);

          inputEl.addEventListener('input', (e) => {
            rowEl.classList.toggle('has-value', !!e.target.value);
            fire(e.target.value.trim());
          });
          inputEl.addEventListener('focus', (e) => {
            if (e.target.value.trim().length >= 2) fire(e.target.value.trim());
          });
          inputEl.addEventListener('blur', () => {
            setTimeout(() => dropdownEl.classList.remove('show'), 150);
          });
          dropdownEl.addEventListener('mousedown', (e) => {
            const item = e.target.closest('.ac-item');
            if (!item) return;
            e.preventDefault();
            const p = dropdownEl._items?.[+item.dataset.i];
            if (!p) return;
            inputEl.value = p.place_name;
            rowEl.classList.add('has-value');
            dropdownEl.classList.remove('show');
            onPick({ name: p.place_name, lat: parseFloat(p.y), lng: parseFloat(p.x) });
          });
        }

        function makeOriginMarkerImage() {
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="28" viewBox="0 0 22 28">
            <defs><filter id="os" x="-30%" y="-10%" width="160%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.35"/></filter></defs>
            <g filter="url(#os)">
              <circle cx="11" cy="11" r="9" fill="#10B981" stroke="white" stroke-width="3"/>
              <circle cx="11" cy="11" r="3" fill="white"/>
            </g>
          </svg>`;
          return new kakao.maps.MarkerImage(
            'data:image/svg+xml;base64,' + btoa(svg),
            new kakao.maps.Size(22, 28),
            { offset: new kakao.maps.Point(11, 11) }
          );
        }

        function setOrigin(p) {
          if (state.origin?.overlay) state.origin.overlay.setMap(null);
          if (state.origin?.marker) state.origin.marker.setMap(null);
          if (!p) { state.origin = null; updateNavButtons(); updateRoute(); if (state.districtName) renderList(state.districtName); return; }

          const pos = new kakao.maps.LatLng(p.lat, p.lng);
          const marker = new kakao.maps.Marker({
            position: pos, draggable: true, image: makeOriginMarkerImage(), zIndex: 60
          });
          marker.setMap(map);
          const overlay = new kakao.maps.CustomOverlay({
            content: `<div class="endpoint-marker origin"><div class="badge">출발 · ${escapeHtml(p.name)}</div></div>`,
            position: pos, yAnchor: 1.8, zIndex: 61
          });
          overlay.setMap(map);

          state.origin = { ...p, marker, overlay };
          document.getElementById('originInput').value = p.name;
          document.getElementById('originRow').classList.add('has-value');

          // 드래그: 라벨 동기 이동
          kakao.maps.event.addListener(marker, 'drag', () => {
            overlay.setPosition(marker.getPosition());
          });
          // 드래그 끝 → reverse geocode + state 갱신
          kakao.maps.event.addListener(marker, 'dragend', () => {
            const np = marker.getPosition();
            const nlat = np.getLat(), nlng = np.getLng();
            overlay.setContent(`<div class="endpoint-marker origin"><div class="badge">출발 · 위치 확인 중…</div></div>`);
            reverseGeocode(nlat, nlng, (name) => {
              state.origin = { ...state.origin, lat: nlat, lng: nlng, name };
              document.getElementById('originInput').value = name;
              overlay.setContent(`<div class="endpoint-marker origin"><div class="badge">출발 · ${escapeHtml(name)}</div></div>`);
              updateRoute();
              if (state.districtName) renderList(state.districtName);
            });
          });

          updateNavButtons();
          updateRoute();
          if (state.districtName) renderList(state.districtName);
        }

        function setDestination(p) {
          if (state.destination?.overlay) state.destination.overlay.setMap(null);
          if (!p) {
            state.destination = null;
            const dist = districtByCode.get(state.districtCode);
            renderList(dist?.name || '');
            updateNavButtons();
            updateRoute();
            return;
          }
          const overlay = new kakao.maps.CustomOverlay({
            content: makeEndpointMarkerContent('dest', '도착 · ' + p.name),
            position: new kakao.maps.LatLng(p.lat, p.lng),
            yAnchor: 1.5, zIndex: 50
          });
          overlay.setMap(map);
          state.destination = { ...p, overlay };
          document.getElementById('destInput').value = p.name;
          document.getElementById('destRow').classList.add('has-value');
          const dist = districtByCode.get(state.districtCode);
          renderList(dist?.name || '');
          updateNavButtons();
          updateRoute();
          if (!state.origin) map.panTo(new kakao.maps.LatLng(p.lat, p.lng));

          // 도착지 자치구 자동 전환 (현재 구와 다르면 그 구 데이터 로드)
          new kakao.maps.services.Geocoder().coord2Address(p.lng, p.lat, (result, status) => {
            if (status !== kakao.maps.services.Status.OK || !result?.[0]) return;
            const guName = result[0].address?.region_2depth_name;
            const found = districts.find(d => d.name === guName);
            if (found && found.code !== state.districtCode) {
              loadDistrict(found.code);  // 자치구 전환 → renderList가 1km 필터링
            }
          });
        }

        // ─── 경유지 ───
        function refreshAddWpButton() {
          const btn = document.getElementById('addWpBtn');
          if (btn) btn.disabled = state.waypoints.length >= MAX_WAYPOINTS;
        }

        function addWaypoint() {
          if (state.waypoints.length >= MAX_WAYPOINTS) return;
          const wpId = 'wp-' + Date.now() + '-' + state.waypoints.length;
          const row = document.createElement('div');
          row.className = 'search-row waypoint';
          row.dataset.wpId = wpId;
          row.innerHTML = `
            <span class="icon">●</span>
            <input class="wp-input" type="text" placeholder="경유지를 입력하세요" autocomplete="off">
            <button class="btn-clear wp-remove" type="button" aria-label="경유지 삭제" style="display:flex">×</button>
            <div class="ac-dropdown"></div>
          `;
          document.getElementById('waypointsContainer').appendChild(row);
          const wp = { id: wpId, name: null, lat: null, lng: null, overlay: null, row };
          state.waypoints.push(wp);
          refreshAddWpButton();

          const inputEl = row.querySelector('.wp-input');
          const dropdownEl = row.querySelector('.ac-dropdown');
          setupAutocomplete(inputEl, dropdownEl, row, (p) => setWaypoint(wpId, p));
          row.querySelector('.wp-remove').addEventListener('click', () => removeWaypoint(wpId));
          setTimeout(() => inputEl.focus(), 0);
        }

        function setWaypoint(wpId, p) {
          const wp = state.waypoints.find(w => w.id === wpId);
          if (!wp) return;
          if (wp.overlay) wp.overlay.setMap(null);
          Object.assign(wp, p);
          const overlay = new kakao.maps.CustomOverlay({
            content: makeEndpointMarkerContent('waypoint', '경유 · ' + p.name),
            position: new kakao.maps.LatLng(p.lat, p.lng),
            yAnchor: 1.5, zIndex: 50
          });
          overlay.setMap(map);
          wp.overlay = overlay;
          updateRoute();
        }

        function removeWaypoint(wpId) {
          const idx = state.waypoints.findIndex(w => w.id === wpId);
          if (idx < 0) return;
          const wp = state.waypoints[idx];
          if (wp.overlay) wp.overlay.setMap(null);
          wp.row.remove();
          state.waypoints.splice(idx, 1);
          refreshAddWpButton();
          updateRoute();
        }

        document.getElementById('addWpBtn').addEventListener('click', addWaypoint);

        setupAutocomplete(
          document.getElementById('originInput'),
          document.getElementById('originAc'),
          document.getElementById('originRow'),
          setOrigin
        );
        setupAutocomplete(
          document.getElementById('destInput'),
          document.getElementById('destAc'),
          document.getElementById('destRow'),
          setDestination
        );

        document.getElementById('originClear').addEventListener('click', () => {
          document.getElementById('originInput').value = '';
          document.getElementById('originRow').classList.remove('has-value');
          setOrigin(null);
        });
        document.getElementById('destClear').addEventListener('click', () => {
          document.getElementById('destInput').value = '';
          document.getElementById('destRow').classList.remove('has-value');
          setDestination(null);
        });

        // ─── 현재 위치 ───
        document.getElementById('useCurrentBtn').addEventListener('click', () => {
          if (!navigator.geolocation) { alert('이 브라우저는 위치 기능을 지원하지 않습니다.'); return; }
          const btn = document.getElementById('useCurrentBtn');
          btn.textContent = '확인 중…'; btn.disabled = true;
          tryGeolocation(
            (pos) => {
              btn.textContent = '현재 위치'; btn.disabled = (locationConsent === false);
              const lat = pos.coords.latitude, lng = pos.coords.longitude;
              showUserLocationMarker(lat, lng);
              reverseGeocode(lat, lng, (name) => setOrigin({ name, lat, lng }));
            },
            (err) => {
              btn.textContent = '현재 위치'; btn.disabled = (locationConsent === false);
              if (locationConsent !== false) alert('위치를 가져올 수 없습니다: ' + (err.message || ''));
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        });

        // ─── 내비 ───
        function updateNavButtons() {
          // 버튼은 항상 활성화. 클릭 시 도착지 없으면 안내 (openKakaoNav/openTmap 내부 처리)
          const has = !!state.destination;
          document.getElementById('kakaoNavBtn').style.opacity = has ? '1' : '0.7';
          document.getElementById('tmapNavBtn').style.opacity = has ? '1' : '0.7';
        }
        function ensureDestinationOrPrompt() {
          if (state.destination) return true;
          const destInput = document.getElementById('destInput');
          if (destInput) {
            destInput.focus();
            destInput.placeholder = '여기에 도착지를 입력해주세요 ↓';
            destInput.style.background = '#FEF3C7';
            setTimeout(() => {
              destInput.placeholder = '도착지를 입력하세요';
              destInput.style.background = '';
            }, 2500);
          }
          alert('먼저 도착지를 입력해주세요.\n(또는 지도/리스트에서 주차장을 클릭하세요)');
          return false;
        }

        function getValidWaypoints() {
          return state.waypoints.filter(w => w.lat != null && w.lng != null);
        }

        function focusOriginPrompt(reason) {
          // 출발지 input에 포커스 + 짧은 안내 (status 영역 활용)
          const oi = document.getElementById('originInput');
          oi.focus();
          statusEl.textContent = reason;
          statusEl.style.display = '';
          clearTimeout(focusOriginPrompt._t);
          focusOriginPrompt._t = setTimeout(() => { statusEl.style.display = 'none'; }, 4000);
        }

        function setDestAndAutoOrigin(p) {
          setDestination(p);
          // 이미 출발지 있음 → 경로는 setDestination 안 updateRoute가 그려줌. 끝.
          if (state.origin) return;

          // 출발지 없음 → 위치 시도 또는 안내
          if (!navigator.geolocation || locationConsent === false) {
            alert('경로를 그리려면 출발지가 필요합니다.\n\n' +
              (locationConsent === false
                ? '📍 헤더의 위치 설정 버튼을 눌러 "사용"으로 바꾸시거나,\n좌측 "출발지" 입력란에 직접 주소를 검색해 주세요.'
                : '좌측 "출발지" 입력란에 직접 주소를 검색해 주세요.'));
            document.getElementById('originInput').focus();
            return;
          }

          statusEl.textContent = '현재 위치를 가져오는 중…';
          statusEl.style.display = '';
          tryGeolocation(
            (pos) => {
              statusEl.style.display = 'none';
              if (state.destination && state.destination.lat === p.lat && state.destination.lng === p.lng) {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                showUserLocationMarker(lat, lng);
                reverseGeocode(lat, lng, (name) => setOrigin({ name, lat, lng }));
              }
            },
            (err) => {
              statusEl.style.display = 'none';
              alert('현재 위치를 가져올 수 없어 경로를 그릴 수 없습니다.\n' +
                (err.code === 1
                  ? '브라우저 위치 권한이 차단되어 있습니다. 주소창 왼쪽 자물쇠 아이콘 → 위치 → 허용으로 바꿔주시거나,\n좌측 "출발지" 입력란에 직접 주소를 검색해 주세요.'
                  : 'GPS 신호가 약합니다. 좌측 "출발지" 입력란에 직접 주소를 검색해 주세요.'));
              document.getElementById('originInput').focus();
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
          );
        }

        function openKakaoNav(destOverride) {
          const dest = destOverride || state.destination;
          const org = state.origin;
          const wps = destOverride ? [] : getValidWaypoints();
          if (!dest) { ensureDestinationOrPrompt(); return; }
          if (isMobile()) {
            if (wps.length > 0 && org) {
              // 경유지 있을 때는 카카오맵 route scheme (vp 파라미터 지원)
              const vp = wps.map(w => `${encodeURIComponent(w.name)},${w.lat},${w.lng}`).join('|');
              const url = `kakaomap://route?sp=${org.lat},${org.lng}&ep=${dest.lat},${dest.lng}&vp=${vp}&by=CAR`;
              window.location.href = url;
            } else {
              // 경유지 없으면 카카오내비
              const url = `kakaonavi://navigate?name=${encodeURIComponent(dest.name)}&x=${dest.lng}&y=${dest.lat}&coord_type=wgs84`;
              window.location.href = url;
              setTimeout(() => {
                window.open(`https://map.kakao.com/?eName=${encodeURIComponent(dest.name)}`, '_blank');
              }, 1500);
            }
          } else {
            // PC: 카카오맵 길찾기 (경유지 미지원)
            const params = new URLSearchParams();
            if (org) params.set('sName', org.name);
            params.set('eName', dest.name);
            window.open(`https://map.kakao.com/?${params.toString()}`, '_blank');
            if (wps.length > 0) {
              setTimeout(() => alert('PC 카카오맵 길찾기는 경유지를 지원하지 않습니다. 모바일에서 이용해주세요.'), 100);
            }
          }
        }

        function openTmap(destOverride) {
          const dest = destOverride || state.destination;
          const org = state.origin;
          const wps = destOverride ? [] : getValidWaypoints();
          if (!dest) { ensureDestinationOrPrompt(); return; }
          if (isMobile()) {
            let url = `tmap://route?goalname=${encodeURIComponent(dest.name)}&goalx=${dest.lng}&goaly=${dest.lat}`;
            if (org) url += `&startname=${encodeURIComponent(org.name)}&startx=${org.lng}&starty=${org.lat}`;
            wps.slice(0, 3).forEach((w, i) => {
              const n = i + 1;
              url += `&via${n}name=${encodeURIComponent(w.name)}&via${n}x=${w.lng}&via${n}y=${w.lat}`;
            });
            window.location.href = url;
          } else {
            alert('티맵은 모바일 앱 전용입니다. 휴대폰으로 접속해서 이용해주세요.');
          }
        }

        document.getElementById('kakaoNavBtn').addEventListener('click', () => openKakaoNav());
        document.getElementById('tmapNavBtn').addEventListener('click', () => openTmap());
        function findPlace(query) {
          // 키워드 검색 → 실패 시 주소 검색
          return new Promise((resolve) => {
            const places = new kakao.maps.services.Places();
            places.keywordSearch(query, (data, status) => {
              if (status === kakao.maps.services.Status.OK && data[0]) {
                resolve({ name: data[0].place_name, lat: parseFloat(data[0].y), lng: parseFloat(data[0].x) });
                return;
              }
              new kakao.maps.services.Geocoder().addressSearch(query, (d2, s2) => {
                if (s2 === kakao.maps.services.Status.OK && d2[0]) {
                  resolve({ name: d2[0].road_address?.address_name || d2[0].address?.address_name || query, lat: parseFloat(d2[0].y), lng: parseFloat(d2[0].x) });
                } else resolve(null);
              });
            });
          });
        }

        document.getElementById('routeSearchBtn').addEventListener('click', async () => {
          const destInputEl = document.getElementById('destInput');
          const destText = destInputEl.value.trim();
          const originInputEl = document.getElementById('originInput');
          const originText = originInputEl.value.trim();

          // 도착지 input에 텍스트가 있는데 state.destination이 비어있거나 텍스트와 다르면 → 검색해서 자동 설정
          if (destText && (!state.destination || state.destination.name !== destText)) {
            statusEl.textContent = '도착지 검색 중…';
            statusEl.style.display = '';
            const found = await findPlace(destText);
            statusEl.style.display = 'none';
            if (!found) {
              alert(`"${destText}" 위치를 찾을 수 없습니다. 다시 입력해 주세요.`);
              destInputEl.focus();
              return;
            }
            setDestination(found);
            await new Promise(r => setTimeout(r, 300));  // setDestination 안의 자치구 전환 시간
          }

          // 출발지도 input에 텍스트만 있고 state.origin이 비어있으면 검색
          if (originText && (!state.origin || state.origin.name !== originText)) {
            statusEl.textContent = '출발지 검색 중…';
            statusEl.style.display = '';
            const found = await findPlace(originText);
            statusEl.style.display = 'none';
            if (found) setOrigin(found);
          }

          if (!state.destination) {
            alert('도착지를 먼저 입력해 주세요.');
            destInputEl.focus();
            return;
          }
          if (state.origin) {
            // 이미 둘 다 있으면 강제 재계산
            updateRoute();
            return;
          }
          // 출발지 없음 → 현재 위치 받아 자동 설정
          if (!navigator.geolocation || locationConsent === false) {
            alert('출발지를 입력해주세요. (또는 헤더의 📍 버튼으로 위치 사용에 동의)');
            document.getElementById('originInput').focus();
            return;
          }
          statusEl.textContent = '현재 위치를 가져오는 중…';
          statusEl.style.display = '';
          tryGeolocation((pos) => {
            statusEl.style.display = 'none';
            const lat = pos.coords.latitude, lng = pos.coords.longitude;
            showUserLocationMarker(lat, lng);
            reverseGeocode(lat, lng, (name) => setOrigin({ name, lat, lng }));
          }, (err) => {
            statusEl.style.display = 'none';
            alert('현재 위치를 가져올 수 없어요. 출발지를 직접 입력해 주세요.');
            document.getElementById('originInput').focus();
          }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
        });

        // ─── 구별 데이터 로드 ───
        async function loadDistrict(code) {
          clearState();
          state.districtCode = code;
          selectEl.value = code;
          history.replaceState(null, '', '#' + code);

          const district = districtByCode.get(code);
          if (!district) { statusEl.textContent = '알 수 없는 구'; return; }

          subEl.textContent = `${district.operator || district.name + ' 시설관리공단'}`;
          updatedAtEl.textContent = '-';
          listEl.innerHTML = '<div class="list-empty">데이터를 불러오는 중…</div>';
          statusEl.textContent = '데이터를 불러오는 중…';
          statusEl.style.display = '';

          if (!district.active) {
            statusEl.style.display = 'none';
            subEl.textContent = '데이터 준비 중';
            listEl.innerHTML = `<div class="list-empty">${escapeHtml(district.name)} 데이터는<br>아직 준비되지 않았어요.</div>`;
            listCountEl.textContent = '주차장 0곳';
            sortLabelEl.style.display = 'none';
            showMapEmpty(district);
            return;
          }

          const cat = state.category;
          const t = Date.now();
          const wantPublic = cat === 'public' || cat === 'all';
          const wantResidential = cat === 'residential' || cat === 'all';
          const wantShared = cat === 'shared' || cat === 'all';

          let publicData = null, residentialData = null, sharedData = null, realtime = null;
          const safeFetch = (url) => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
          try {
            if (district.aggregate) {
              // 서울 전체: 모든 active 구의 lots 합치기
              const codes = districts.filter(d => d.active && !d.aggregate).map(d => d.code);
              if (wantPublic) {
                const arr = await Promise.all(codes.map(c => safeFetch(`./data/lots/${c}.json?_=${t}`)));
                publicData = { lots: arr.flatMap(d => d?.lots || []), operator: '서울특별시' };
                realtime = await safeFetch(`./data/realtime.json?_=${t}`);
              }
              if (wantResidential) {
                const arr = await Promise.all(codes.map(c => safeFetch(`./data/residential/${c}.json?_=${t}`)));
                residentialData = { lots: arr.flatMap(d => d?.lots || []) };
              }
              if (wantShared) {
                sharedData = await safeFetch(`./data/lots/shared_seoul.json?_=${t}`);
              }
            } else {
              const fetches = [];
              if (wantPublic) {
                fetches.push(fetch(`./data/lots/${code}.json?_=${t}`).catch(() => null));
                fetches.push(fetch(`./data/realtime.json?_=${t}`).catch(() => null));
              }
              if (wantResidential) {
                fetches.push(fetch(`./data/residential/${code}.json?_=${t}`).catch(() => null));
              }
              if (wantShared) {
                // shared는 서울 전체 한 파일 → 구별로 필터링
                fetches.push(fetch(`./data/lots/shared_seoul.json?_=${t}`).catch(() => null));
              }
              const results = await Promise.all(fetches);
              let idx = 0;
              if (wantPublic) {
                const pRes = results[idx++];
                if (pRes && pRes.ok) {
                  try { publicData = await pRes.json(); } catch {}
                }
                const rRes = results[idx++];
                if (rRes && rRes.ok) { try { realtime = await rRes.json(); } catch {} }
              }
              if (wantResidential) {
                const rsRes = results[idx++];
                if (rsRes && rsRes.ok) { try { residentialData = await rsRes.json(); } catch {} }
              }
              if (wantShared) {
                const shRes = results[idx++];
                if (shRes && shRes.ok) {
                  try {
                    const sd = await shRes.json();
                    // '공유주차장' 단독 선택 시: 13개 자치구에만 분포해서 빈 화면 방지 위해
                    //   자치구 필터링 없이 서울 전체 111곳 모두 표시
                    // '전체' 카테고리 시: 현재 구만 필터링 (공영/거주자우선과 일치)
                    if (cat === 'shared') {
                      sharedData = { ...sd, lots: sd.lots || [] };
                    } else {
                      sharedData = { ...sd, lots: (sd.lots || []).filter(l => l.districtCode === code) };
                    }
                  } catch {}
                }
              }
            }
          } catch (e) {
            statusEl.textContent = `데이터 로드 실패: ${e.message}`;
            return;
          }

          const realtimeLots = realtime?.lots || {};
          const allRaw = [
            ...(publicData?.lots || []),
            ...(residentialData?.lots || []),
            ...(sharedData?.lots || []),
          ];
          const visibleLots = allRaw
            .filter(l => l.hourlyAvailable)
            .map((l, i) => {
              // realtimeKey 우선, 없으면 lot.code(=PKLT_CD)도 매칭 시도
              const rk = l.realtimeKey || (l.code ? String(l.code) : null);
              const rt = rk && realtimeLots[rk] ? realtimeLots[rk] : null;
              return {
                ...l,
                _id: `${code}-${cat}-${i}`,
                _districtCode: l.districtCode || code,  // shared는 자체 districtCode, 그 외는 현재 구
                availableSpaces: rt ? rt.available : null,
                spaces: rt && rt.total > 0 ? rt.total : l.spaces,  // 실시간 총면수가 더 정확
                realtimeUpdatedAt: rt ? rt.updatedAt : null,
              };
            });
          // 전체 모드용 dataset 객체 (subtitle용)
          const dataset = publicData || residentialData;

          const catLabel = cat === 'residential' ? '거주자우선주차'
            : cat === 'shared' ? '공유주차장 (서울 전체)'
            : cat === 'all' ? '전체 주차장'
            : '시간주차 가능';
          subEl.innerHTML = `${catLabel} <b>${visibleLots.length}</b>곳 · ${escapeHtml(publicData?.operator || dataset?.source || district.operator || '')}`;
          updatedAtEl.textContent = dataset?.updatedAt || '-';

          const publicOpenImg = makeMarkerImage('public', true);
          const publicClosedImg = makeMarkerImage('public', false);
          const residentialMarkerImg = makeMarkerImage('residential');
          const sharedMarkerImg = makeMarkerImage('shared');
          // 화면 밖 주차장용 작은 동그라미
          const publicOpenDot = makeSmallDotImage('public', true);
          const publicClosedDot = makeSmallDotImage('public', false);
          const sharedDot = makeSmallDotImage('shared');
          const residentialDot = makeSmallDotImage('residential');
          const _now = new Date();
          // 위경도가 데이터에 있으면 지오코딩 스킵
          const lookups = visibleLots.map(lot => {
            if (lot.lat != null && lot.lng != null) {
              return Promise.resolve(lot);
            }
            return new Promise(resolve => {
              new kakao.maps.services.Geocoder().addressSearch(lot.address, (result, status) => {
                if (status === kakao.maps.services.Status.OK) {
                  resolve({ ...lot, lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
                } else {
                  console.warn('주소 변환 실패:', lot.name, lot.address);
                  resolve(null);
                }
              });
            });
          });

          const results = await Promise.all(lookups);
          if (state.districtCode !== code || state.category !== cat) return;

          const valid = results.filter(r => r !== null);
          const bounds = new kakao.maps.LatLngBounds();
          // 거주자우선주차는 클러스터러 없이 개별 마커로 상시 표시 (공영주차장처럼)
          const useClusterer = valid.length > 80 && cat !== 'residential';
          const showChips = valid.length <= 50;

          if (useClusterer) {
            state.clusterer = new kakao.maps.MarkerClusterer({
              map, averageCenter: true, minLevel: 4,
              styles: [{
                width: '36px', height: '36px',
                background: '#10B981', color: 'white',
                borderRadius: '50%', textAlign: 'center',
                lineHeight: '36px', fontWeight: '700', fontSize: '13px',
                border: '2px solid white',
                boxShadow: '0 2px 8px rgba(16,185,129,0.4)',
              }],
            });
          }

          const clusteredMarkers = [];
          valid.forEach(lot => {
            lot._coords = new kakao.maps.LatLng(lot.lat, lot.lng);
            state.lotById.set(lot._id, lot);
            state.lots.push(lot);

            const catGroup = getCategoryGroup(lot);
            const isOpen = isOperating(lot, _now);
            lot._isOpen = isOpen;
            lot._catGroup = catGroup;
            // 카테고리별 큰 이미지(화면 안) / 작은 동그라미(화면 밖) 결정
            const bigImg = catGroup === 'residential' ? residentialMarkerImg
                         : catGroup === 'shared' ? sharedMarkerImg
                         : (isOpen ? publicOpenImg : publicClosedImg);
            const smallImg = catGroup === 'residential' ? residentialDot
                           : catGroup === 'shared' ? sharedDot
                           : (isOpen ? publicOpenDot : publicClosedDot);
            const marker = new kakao.maps.Marker({
              position: lot._coords,
              title: `${lot.name} [${CATEGORY_LABEL[catGroup]}]` + (isOpen ? '' : ' (운영시간 외)'),
              image: bigImg
            });
            marker._bigImg = bigImg;
            marker._smallImg = smallImg;
            // 대량(>80)이면 클러스터러로, 적으면 개별 표시
            if (useClusterer) {
              clusteredMarkers.push(marker);
            } else {
              marker.setMap(map);
            }
            kakao.maps.event.addListener(marker, 'click', () => focusLot(lot));

            // 칩은 공영(public)이면서 데이터가 적을 때만
            marker._lotId = lot._id;
            if (catGroup === 'public' && showChips) {
              const chipOverlay = new kakao.maps.CustomOverlay({
                content: buildChip(lot), position: lot._coords,
                yAnchor: 2.6, zIndex: 3
              });
              chipOverlay.setMap(map);
              chipOverlay._lotId = lot._id;
              state.chipOverlays.push(chipOverlay);
            }

            state.markers.push(marker);
            bounds.extend(lot._coords);
          });

          if (useClusterer && clusteredMarkers.length) state.clusterer.addMarkers(clusteredMarkers);
          if (valid.length > 0) map.setBounds(bounds);
          // 현재 뷰포트 기준으로 마커 이미지 업데이트 (안=큰핀, 밖=작은점)
          setTimeout(updateMarkerVisuals, 300);
          renderList(district.name);

          if (valid.length < visibleLots.length) {
            statusEl.textContent = `${valid.length}/${visibleLots.length}곳 표시 (일부 주소 변환 실패)`;
            setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
          } else {
            statusEl.style.display = 'none';
          }
        }

        selectEl.addEventListener('change', e => loadDistrict(e.target.value));
        document.getElementById('categorySelect').addEventListener('change', async e => {
          state.category = e.target.value;
          try { await loadDistrict(state.districtCode || initialCode); } catch {}
          // 카테고리 전환 후에도 '내 위치로 이동' 효과 적용 (위치 권한 있을 때)
          if (state.userLocation) {
            applyLocateView(state.userLocation.lat, state.userLocation.lng);
            setTimeout(() => {
              if (state.userLocation) applyLocateView(state.userLocation.lat, state.userLocation.lng);
            }, 800);
          }
        });
        window.addEventListener('hashchange', () => {
          const code = location.hash.replace('#', '');
          if (code && districtByCode.has(code) && code !== state.districtCode) loadDistrict(code);
        });

        loadDistrict(initialCode);

        // 페이지 로드 직후 권한 동의 모달 → 동의 시:
        // ① 지도에 현재 위치 마커  ② 자동 구 전환  ③ 출발지에 현재 위치 주소 입력
        tryGeolocation((pos) => {
          const lat = pos.coords.latitude, lng = pos.coords.longitude;
          showUserLocationMarker(lat, lng);  // 즉시 펄스 마커 표시
          new kakao.maps.services.Geocoder().coord2Address(lng, lat, async (result, status) => {
            const r = (status === kakao.maps.services.Status.OK && result?.[0]) ? result[0] : null;
            const name = r ? (r.road_address?.address_name || r.address?.address_name || '현재 위치') : '현재 위치';
            setOrigin({ name, lat, lng });  // 출발지 자동 입력
            // 자치구 자동 전환 (hash 없을 때만) — await로 데이터 로드까지 정확히 기다림
            if (!hashCode && r) {
              const guName = r.address?.region_2depth_name;
              const found = districts.find(d => d.name === guName);
              if (found && found.code !== state.districtCode) {
                try { await loadDistrict(found.code); } catch {}
              }
            }
            // 첫 진입 시 자동으로 "내 위치로 이동" 효과 (panTo + setLevel 4)
            // loadDistrict의 setBounds가 끝난 직후 한 번 더 안전하게 덮어씀
            applyLocateView(lat, lng);
            setTimeout(() => applyLocateView(lat, lng), 800);
          });
        }, () => {}, { timeout: 10000, maximumAge: 300000 });
      });
    })();
  </script>
</body>
</html>
