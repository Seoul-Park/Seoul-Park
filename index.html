<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>서울시 공영주차장 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --brand: #3182F6;
      --brand-dark: #1B64DA;
      --brand-soft: #EEF4FF;
      --green: #10B981;
      --green-soft: #ECFDF5;
      --red: #DC2626;
      --red-soft: #FEF2F2;
      --bg: #FFFFFF;
      --bg-subtle: #F4F6F8;
      --text: #1A1F36;
      --text-muted: #6B7280;
      --text-dim: #9CA3AF;
      --border: #E5E7EB;
      --border-soft: #F1F3F5;
      --warn-bg: #FFF4E5;
      --warn-text: #C2410C;
      --shadow-sm: 0 1px 3px rgba(17,24,39,0.08);
      --shadow: 0 4px 16px rgba(17, 24, 39, 0.08), 0 1px 4px rgba(17, 24, 39, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; }
    #app { display: flex; flex-direction: column; height: 100vh; }

    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex; align-items: center; gap: 14px;
      z-index: 100; flex-shrink: 0;
    }
    .logo {
      width: 36px; height: 36px;
      background: var(--brand); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 18px;
      flex-shrink: 0;
    }
    .titles { flex: 1; min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .title-row h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .district-select-wrap { position: relative; display: inline-block; }
    .district-select {
      appearance: none; -webkit-appearance: none;
      background: var(--brand-soft); color: var(--brand);
      font-size: 13px; font-weight: 700;
      padding: 4px 26px 4px 12px;
      border: 0; border-radius: 8px;
      cursor: pointer; font-family: inherit;
      letter-spacing: -0.01em;
    }
    .district-select:hover { background: #E0EAFF; }
    .district-select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
    .district-select-wrap::after {
      content: '▾'; position: absolute;
      right: 9px; top: 50%; transform: translateY(-50%);
      color: var(--brand); font-size: 10px;
      pointer-events: none;
    }
    .titles .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .titles .sub b { color: var(--brand); font-weight: 700; }
    .updated {
      font-size: 11px; color: var(--text-dim);
      padding: 4px 10px; background: var(--bg-subtle); border-radius: 12px;
      flex-shrink: 0;
    }

    .main { flex: 1; display: flex; min-height: 0; }
    aside.list-panel {
      width: 340px; background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      flex-shrink: 0;
    }

    /* Search panel */
    .search-panel {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg);
      flex-shrink: 0;
    }
    .search-row {
      display: flex; align-items: center;
      background: var(--bg-subtle);
      border-radius: 10px;
      padding: 0 6px 0 10px;
      margin-bottom: 6px;
      position: relative;
    }
    .search-row .icon {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }
    .search-row.origin .icon { color: var(--green); }
    .search-row.dest .icon { color: var(--red); }
    .search-row input {
      flex: 1; border: 0; background: transparent;
      padding: 9px 8px;
      font-size: 13px; font-family: inherit;
      color: var(--text); min-width: 0;
    }
    .search-row input:focus { outline: none; }
    .search-row input::placeholder { color: var(--text-dim); }
    .search-row .btn-mini {
      border: 0; background: transparent;
      padding: 4px 8px; cursor: pointer;
      font-size: 11px; font-weight: 600;
      color: var(--brand); flex-shrink: 0;
      border-radius: 6px;
    }
    .search-row .btn-mini:hover { background: var(--brand-soft); }
    .search-row .btn-clear {
      width: 20px; height: 20px;
      border: 0; background: var(--border);
      border-radius: 50%; cursor: pointer;
      color: var(--text-muted);
      display: none; align-items: center; justify-content: center;
      font-size: 12px; line-height: 1; padding: 0;
      flex-shrink: 0;
    }
    .search-row.has-value .btn-clear { display: flex; }
    .search-row.has-value .btn-mini { display: none; }
    .btn-add-wp {
      width: 22px; height: 22px;
      border: 0; background: var(--brand);
      color: white; border-radius: 50%;
      cursor: pointer; font-size: 16px; font-weight: 700;
      line-height: 1; padding: 0;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-right: 2px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-add-wp:hover { background: var(--brand-dark); }
    .btn-add-wp:active { transform: scale(0.92); }
    .btn-add-wp:disabled {
      background: var(--border); color: var(--text-dim);
      cursor: not-allowed;
    }
    .search-row.waypoint .icon { color: #F59E0B; }
    .endpoint-marker.waypoint .badge { background: #F59E0B; }
    .endpoint-marker.waypoint .dot-base { background: #F59E0B; }
    .ac-dropdown {
      position: absolute; top: 100%; left: 0; right: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      margin-top: 4px;
      max-height: 240px; overflow-y: auto;
      z-index: 50;
      display: none;
    }
    .ac-dropdown.show { display: block; }
    .ac-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-soft);
    }
    .ac-item:last-child { border-bottom: 0; }
    .ac-item:hover, .ac-item.focused { background: var(--bg-subtle); }
    .ac-item .ac-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .ac-item .ac-addr { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .ac-empty { padding: 12px; text-align: center; color: var(--text-muted); font-size: 12px; }

    .nav-buttons {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .nav-btn {
      padding: 9px 0;
      border: 0; border-radius: 8px;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .nav-btn:active { transform: scale(0.98); }
    .nav-btn.kakao { background: #FEE500; color: #191919; }
    .nav-btn.tmap { background: #EB1F4F; color: white; }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* List */
    .list-area { flex: 1; overflow-y: auto; min-height: 0; }
    .list-header {
      padding: 12px 16px 8px;
      font-size: 12px; font-weight: 600;
      color: var(--text-muted); letter-spacing: 0.02em;
      position: sticky; top: 0; background: var(--bg); z-index: 2;
      border-bottom: 1px solid var(--border-soft);
      display: flex; justify-content: space-between; align-items: center;
    }
    .list-header .sort-label {
      font-size: 11px; color: var(--brand); font-weight: 700;
    }
    .list-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }
    .list-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
      transition: background 0.15s;
      display: flex; flex-direction: column; gap: 4px;
    }
    .list-item:hover { background: var(--bg-subtle); }
    .list-item.active {
      background: var(--brand-soft);
      box-shadow: inset 3px 0 0 var(--brand);
    }
    .li-row { display: flex; align-items: center; gap: 6px; }
    .li-name {
      font-size: 14px; font-weight: 700; letter-spacing: -0.01em;
      flex: 0 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .li-distance {
      font-size: 11px; font-weight: 700; color: var(--brand);
      background: var(--brand-soft); padding: 2px 8px; border-radius: 10px;
      flex-shrink: 0; margin-left: auto;
    }
    .li-addr {
      font-size: 12px; color: var(--text-muted);
      flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .li-tel {
      font-size: 11px; color: var(--text-muted);
      flex-shrink: 0; font-feature-settings: 'tnum';
    }
    .li-tel a { color: inherit; text-decoration: none; }
    .li-tel a:hover { color: var(--brand); }
    .li-chip {
      display: inline-flex; align-items: center;
      padding: 2px 7px;
      background: var(--brand-soft); color: var(--brand);
      font-size: 10px; font-weight: 700; border-radius: 5px;
      flex-shrink: 0;
    }
    .li-spaces { font-size: 11px; color: var(--text-muted); font-weight: 500; flex-shrink: 0; }
    .avail { font-weight: 700; color: var(--brand); }
    .avail.full { color: var(--red); }
    .avail.unknown { color: var(--text-dim); font-weight: 500; }
    .total { color: var(--text-muted); }
    .li-tag {
      padding: 2px 6px; background: var(--warn-bg); color: var(--warn-text);
      font-size: 10px; font-weight: 600; border-radius: 4px;
    }

    #map { flex: 1; position: relative; background: #f0f3f5; }
    #status {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: white; padding: 14px 20px; border-radius: 12px;
      box-shadow: var(--shadow); z-index: 10; font-size: 14px;
      color: var(--text-muted);
    }
    .map-empty {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; z-index: 5;
      padding: 32px 28px; background: white; border-radius: 16px;
      box-shadow: var(--shadow); max-width: 360px;
    }
    .map-empty .icon { font-size: 32px; margin-bottom: 8px; }
    .map-empty .title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .map-empty .msg { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

    /* Endpoint markers (origin/destination) */
    .endpoint-marker {
      display: flex; flex-direction: column; align-items: center;
      user-select: none; pointer-events: none;
    }
    .endpoint-marker .badge {
      padding: 4px 10px; border-radius: 14px;
      font-size: 11px; font-weight: 700; color: white;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }
    .endpoint-marker.origin .badge { background: var(--green); }
    .endpoint-marker.dest .badge { background: var(--red); }
    .endpoint-marker .stalk {
      width: 2px; height: 8px;
      background: rgba(0,0,0,0.3);
    }
    .endpoint-marker .dot-base {
      width: 12px; height: 12px; border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .endpoint-marker.origin .dot-base { background: var(--green); }
    .endpoint-marker.dest .dot-base { background: var(--red); }

    .route-label {
      background: white;
      padding: 5px 10px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-size: 11px; font-weight: 700;
      color: var(--brand);
      white-space: nowrap;
      border: 1px solid var(--brand-soft);
      transform: translateY(-50%);
      pointer-events: none;
    }
    .route-label .km { color: var(--text); }
    .route-label .est { color: var(--text-muted); font-weight: 500; margin-left: 4px; }

    /* Always-visible label chip */
    .chip-wrap { position: relative; cursor: pointer; user-select: none; }
    .chip {
      background: white; padding: 6px 10px; border-radius: 18px;
      box-shadow: var(--shadow); font-size: 12px; font-weight: 700;
      color: var(--text); white-space: nowrap;
      border: 1px solid var(--border-soft);
      display: inline-flex; align-items: center; gap: 6px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .chip-wrap:hover .chip { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(17,24,39,0.15); }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
    .chip .price { color: var(--brand); }
    .chip .spaces {
      color: var(--text-muted); font-weight: 500;
      padding-left: 6px; margin-left: 2px;
      border-left: 1px solid var(--border);
    }
    .chip-tail {
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      width: 1px; height: 4px; background: var(--border);
    }

    /* Card */
    .card-wrap {
      position: relative;
      filter: drop-shadow(0 12px 32px rgba(17, 24, 39, 0.2));
    }
    .card-wrap::after {
      content: ''; position: absolute;
      bottom: -8px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 9px solid white;
    }
    .card {
      width: 280px; background: white;
      border-radius: 16px; padding: 18px;
      font-size: 13px; line-height: 1.5;
      position: relative;
    }
    .card .close {
      position: absolute; top: 12px; right: 12px;
      width: 24px; height: 24px;
      border: 0; background: var(--bg-subtle); border-radius: 50%;
      cursor: pointer; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; line-height: 1;
    }
    .card .close:hover { background: var(--border); color: var(--text); }
    .card .name {
      font-size: 16px; font-weight: 700;
      letter-spacing: -0.01em; padding-right: 28px;
    }
    .card .addr { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .card .tag {
      display: inline-block; padding: 2px 8px;
      background: var(--warn-bg); color: var(--warn-text);
      font-size: 11px; font-weight: 600;
      border-radius: 6px; margin-top: 12px;
    }
    .card .price-box {
      background: linear-gradient(135deg, #EEF4FF 0%, #F0F8FF 100%);
      border-radius: 12px; padding: 12px 14px; margin-top: 14px;
    }
    .card .price-box .label { font-size: 11px; color: var(--brand); font-weight: 600; }
    .card .price-box .value {
      font-size: 20px; font-weight: 800; color: var(--text);
      letter-spacing: -0.02em; margin-top: 2px;
    }
    .card .price-box .hour { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .card .price-box .note {
      font-size: 11px; color: var(--text-muted);
      margin-top: 6px; padding-top: 6px;
      border-top: 1px dashed rgba(49,130,246,0.2);
    }
    .card .meta {
      display: grid; grid-template-columns: auto 1fr; gap: 6px 12px;
      margin-top: 14px; font-size: 12px;
    }
    .card .meta dt { color: var(--text-muted); }
    .card .meta dd { color: var(--text); font-weight: 500; }
    .card-actions {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 6px; margin-top: 14px;
    }
    .card-actions button, .card-actions a {
      padding: 10px 0;
      text-align: center; text-decoration: none;
      border: 0; border-radius: 10px;
      font-size: 12px; font-weight: 700;
      cursor: pointer; display: block;
    }
    .card-actions .set-dest { background: var(--brand); color: white; }
    .card-actions .set-dest:hover { background: var(--brand-dark); }
    .card-actions .kakao { background: #FEE500; color: #191919; }
    .card-actions .tmap { background: #EB1F4F; color: white; }
    .card-actions .card-kakao-nav { background: #FEE500; color: #191919; }
    .card-actions .card-tmap-nav { background: #EB1F4F; color: white; }
    .card-actions + .card-actions { margin-top: 6px; grid-template-columns: 1fr; }

    @media (max-width: 768px) {
      .main { flex-direction: column-reverse; }
      aside.list-panel { width: 100%; height: 55vh; border-right: none; border-top: 1px solid var(--border); }
      .card { width: 240px; padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">P</div>
      <div class="titles">
        <div class="title-row">
          <h1>서울시</h1>
          <span class="district-select-wrap">
            <select id="districtSelect" class="district-select" aria-label="구 선택"></select>
          </span>
          <span class="district-select-wrap">
            <select id="categorySelect" class="district-select" aria-label="주차장 종류">
              <option value="all">전체</option>
              <option value="public">공영주차장</option>
              <option value="shared" disabled>공유주차장 (준비 중)</option>
              <option value="residential">거주자우선주차장</option>
            </select>
          </span>
        </div>
        <div class="sub" id="subText">데이터를 불러오는 중…</div>
      </div>
      <div class="updated">갱신 <span id="updatedAt">-</span></div>
    </header>
    <div class="main">
      <aside class="list-panel">
        <div class="search-panel">
          <div class="search-row origin" id="originRow">
            <span class="icon">●</span>
            <input id="originInput" type="text" placeholder="출발지를 입력하세요" autocomplete="off">
            <button class="btn-mini" id="useCurrentBtn" type="button">현재 위치</button>
            <button class="btn-clear" id="originClear" type="button" aria-label="지우기">×</button>
            <div class="ac-dropdown" id="originAc"></div>
          </div>
          <div id="waypointsContainer"></div>
          <div class="search-row dest" id="destRow">
            <span class="icon">●</span>
            <input id="destInput" type="text" placeholder="도착지를 입력하세요" autocomplete="off">
            <button class="btn-add-wp" id="addWpBtn" type="button" aria-label="경유지 추가" title="경유지 추가">+</button>
            <button class="btn-clear" id="destClear" type="button" aria-label="지우기">×</button>
            <div class="ac-dropdown" id="destAc"></div>
          </div>
          <div class="nav-buttons">
            <button class="nav-btn kakao" id="kakaoNavBtn" type="button" disabled>카카오내비</button>
            <button class="nav-btn tmap" id="tmapNavBtn" type="button" disabled>티맵</button>
          </div>
        </div>

        <div class="list-area">
          <div class="list-header">
            <span id="listCount">전체 주차장</span>
            <span id="sortLabel" class="sort-label" style="display:none">가까운 순</span>
          </div>
          <div id="list"></div>
        </div>
      </aside>

      <div id="map">
        <div id="status">데이터를 불러오는 중…</div>
      </div>
    </div>
  </div>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=3e872457ee4739baa130378d4b3042ea&libraries=services,clusterer&autoload=false"></script>
  <script>
    // ───────────── 유틸 ─────────────
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function shortHourly(h) { return h.split('(')[0].trim(); }
    function hourlyHourPart(h) { const m = h.match(/\(([^)]+)\)/); return m ? m[1] : ''; }

    function haversineMeters(a, b) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const la1 = toRad(a.lat), la2 = toRad(b.lat);
      const x = Math.sin(dLat/2)**2 + Math.sin(dLng/2)**2 * Math.cos(la1) * Math.cos(la2);
      return 2 * R * Math.asin(Math.sqrt(x));
    }
    function formatDistance(m) {
      if (m < 1000) return Math.round(m) + 'm';
      return (m / 1000).toFixed(m < 10000 ? 1 : 0) + 'km';
    }
    function isMobile() {
      return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    }
    function debounce(fn, ms) {
      let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function spacesDisplay(lot) {
      const total = lot.spaces;
      const avail = lot.availableSpaces;
      if (total == null) return '';
      let availHtml;
      if (avail == null) availHtml = '<span class="avail unknown">—</span>';
      else if (avail === 0) availHtml = '<span class="avail full">만차</span>';
      else availHtml = `<span class="avail">${avail}</span>`;
      return `${availHtml}<span class="total">/${total}면</span>`;
    }

    function makeMarkerImage(category) {
      if (category === 'residential') {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
          <circle cx="9" cy="9" r="6" fill="#10B981" stroke="white" stroke-width="2.5"/>
        </svg>`;
        return new kakao.maps.MarkerImage(
          'data:image/svg+xml;base64,' + btoa(svg),
          new kakao.maps.Size(18, 18),
          { offset: new kakao.maps.Point(9, 9) }
        );
      }
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
        <defs><filter id="s" x="-30%" y="-10%" width="160%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.3"/></filter></defs>
        <g filter="url(#s)">
          <path d="M16 1C7.7 1 1 7.7 1 16c0 11 15 22 15 22s15-11 15-22C31 7.7 24.3 1 16 1z" fill="#3182F6"/>
          <circle cx="16" cy="16" r="10" fill="white"/>
          <text x="16" y="21" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#3182F6">P</text>
        </g>
      </svg>`;
      return new kakao.maps.MarkerImage(
        'data:image/svg+xml;base64,' + btoa(svg),
        new kakao.maps.Size(32, 40),
        { offset: new kakao.maps.Point(16, 40) }
      );
    }

    function buildChip(lot) {
      const spacesHtml = lot.spaces != null ? `<span class="spaces">${spacesDisplay(lot)}</span>` : '';
      return `
        <div class="chip-wrap" data-lot-id="${escapeHtml(lot._id)}">
          <div class="chip">
            <span class="dot"></span>
            <span class="price">${escapeHtml(shortHourly(lot.hourly))}</span>
            ${spacesHtml}
          </div>
          <div class="chip-tail"></div>
        </div>
      `;
    }

    function buildCard(lot) {
      const monthly = lot.monthly || {};
      const monthlyAll = monthly.all && monthly.all !== '-' ? monthly.all : null;
      const isSpecial = lot.category === 'special';
      const tag = isSpecial
        ? (lot.applyMethod && lot.applyMethod.includes('방문차량') ? '방문차량 전용' : '시간제 전용')
        : null;
      const holidayNote = lot.hours && /공휴일|일요일|토요일/.test(lot.hours)
        ? '평일·공휴일 안내가 운영시간에 포함됨' : null;
      const mapLinkHtml = lot.mapLink
        ? `<a class="kakao" href="${escapeHtml(lot.mapLink)}" target="_blank" rel="noopener">카카오맵</a>` : '';

      return `
        <div class="card-wrap">
          <div class="card">
            <button class="close" aria-label="닫기">×</button>
            <div class="name">${escapeHtml(lot.name)}</div>
            <div class="addr">${escapeHtml(lot.address)}</div>
            ${tag ? `<div class="tag">${escapeHtml(tag)}</div>` : ''}
            <div class="price-box">
              <div class="label">시간주차 요금</div>
              <div class="value">${escapeHtml(shortHourly(lot.hourly))}</div>
              ${hourlyHourPart(lot.hourly) ? `<div class="hour">${escapeHtml(hourlyHourPart(lot.hourly))}</div>` : ''}
              ${holidayNote ? `<div class="note">${escapeHtml(holidayNote)}</div>` : ''}
            </div>
            <dl class="meta">
              <dt>주차면수</dt><dd>${spacesDisplay(lot)} ${lot.availableSpaces != null ? `<span style="color:var(--text-dim);font-size:11px">· 실시간</span>` : `<span style="color:var(--text-dim);font-size:11px">· 실시간 잔여 미제공</span>`}</dd>
              <dt>운영시간</dt><dd>${escapeHtml(lot.hours)}</dd>
            </dl>
            <div class="card-actions">
              <button class="set-dest" data-lot-id="${escapeHtml(lot._id)}">경로 검색</button>
              <button class="card-kakao-nav" data-lot-id="${escapeHtml(lot._id)}">카카오내비</button>
              <button class="card-tmap-nav" data-lot-id="${escapeHtml(lot._id)}">티맵</button>
            </div>
            ${mapLinkHtml ? `<div class="card-actions">${mapLinkHtml}</div>` : ''}
          </div>
        </div>
      `;
    }

    function cleanLotName(name) {
      return String(name || '')
        .replace(/\s*공영주차장\s*\(시\)\s*$/, '')
        .trim();
    }

    function formatTel(tel) {
      if (!tel) return '';
      const t = String(tel).trim();
      const href = 'tel:' + t.replace(/[^0-9+]/g, '');
      return `<a href="${escapeHtml(href)}">${escapeHtml(t)}</a>`;
    }

    function buildListItem(lot, districtName) {
      const stripPrefix = new RegExp('^서울(?:특별시|시)?\\s*' + districtName + '\\s*');
      const distHtml = lot._distance != null
        ? `<span class="li-distance">${formatDistance(lot._distance)}</span>` : '';
      const telHtml = lot.tel ? `<span class="li-tel">${formatTel(lot.tel)}</span>` : '';
      return `
        <div class="list-item" data-lot-id="${escapeHtml(lot._id)}">
          <div class="li-row">
            <span class="li-name">${escapeHtml(cleanLotName(lot.name))}</span>
            <span class="li-chip">${escapeHtml(shortHourly(lot.hourly))}</span>
            <span class="li-spaces">${spacesDisplay(lot)}</span>
            ${distHtml}
          </div>
          <div class="li-row">
            <span class="li-addr">${escapeHtml(lot.address.replace(stripPrefix, ''))}</span>
            ${telHtml}
          </div>
        </div>
      `;
    }

    function makeEndpointMarkerContent(type, label) {
      return `
        <div class="endpoint-marker ${type}">
          <div class="badge">${escapeHtml(label)}</div>
          <div class="stalk"></div>
          <div class="dot-base"></div>
        </div>
      `;
    }

    // ───────────── 메인 ─────────────
    (async function main() {
      const statusEl = document.getElementById('status');
      const selectEl = document.getElementById('districtSelect');
      const listEl = document.getElementById('list');
      const subEl = document.getElementById('subText');
      const updatedAtEl = document.getElementById('updatedAt');
      const mapContainer = document.getElementById('map');
      const listCountEl = document.getElementById('listCount');
      const sortLabelEl = document.getElementById('sortLabel');

      // districts
      let districtsData;
      try {
        const res = await fetch('./data/districts.json?_=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        districtsData = await res.json();
      } catch (e) {
        statusEl.textContent = '구 목록 로드 실패: ' + e.message;
        return;
      }
      const districts = districtsData.districts;
      const districtByCode = new Map(districts.map(d => [d.code, d]));
      selectEl.innerHTML = districts.map(d => {
        const label = d.active ? d.name : `${d.name} (준비 중)`;
        return `<option value="${d.code}" ${d.active ? '' : 'disabled'}>${label}</option>`;
      }).join('');

      const hashCode = location.hash.replace('#', '');
      const initialCode = (hashCode && districtByCode.get(hashCode))
        ? hashCode
        : 'guro';  // 첫 로드 fallback (geolocation 결과 오면 자동 전환)

      kakao.maps.load(() => {
        const map = new kakao.maps.Map(mapContainer, {
          center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7
        });

        const state = {
          markers: [], chipOverlays: [],
          clusterer: null,
          openCardOverlay: null,
          lotById: new Map(),
          lots: [],
          districtCode: null,
          category: 'all',
          mapEmptyEl: null,
          origin: null,         // { name, lat, lng, overlay }
          destination: null,    // { name, lat, lng, overlay }
          waypoints: [],        // [{ id, name, lat, lng, overlay, row }]
          routePolyline: null,
          routeLabel: null,
          routePathCoords: null,   // [[lat,lng], ...] 경로 좌표 캐시
          districtName: '',        // renderList 재호출용
        };
        const MAX_WAYPOINTS = 3;

        function clearState() {
          if (state.openCardOverlay) { state.openCardOverlay.setMap(null); state.openCardOverlay = null; }
          state.markers.forEach(m => m.setMap(null));
          state.chipOverlays.forEach(o => o.setMap(null));
          state.markers = []; state.chipOverlays = [];
          if (state.clusterer) { state.clusterer.clear(); }
          state.lotById.clear(); state.lots = [];
          if (state.mapEmptyEl) { state.mapEmptyEl.remove(); state.mapEmptyEl = null; }
          clearRoute();
          // 경유지 정리 (구 변경 시 유지하고 싶다면 이 줄 빼기)
        }

        function clearRoute() {
          if (state.routePolyline) { state.routePolyline.setMap(null); state.routePolyline = null; }
          if (state.routeLabel) { state.routeLabel.setMap(null); state.routeLabel = null; }
          state.routePathCoords = null;
        }

        function minDistMToPath(lat, lng, coords) {
          let min = Infinity;
          for (let i = 0; i < coords.length; i++) {
            const [plat, plng] = coords[i];
            const d = haversineMeters({ lat, lng }, { lat: plat, lng: plng });
            if (d < min) { min = d; if (min < 50) break; }
          }
          return min;
        }

        function applyMapVisibility(visibleLotIds) {
          const isFiltered = visibleLotIds !== null;
          const visSet = visibleLotIds ? new Set(visibleLotIds) : null;
          state.markers.forEach(m => {
            const v = !isFiltered || visSet.has(m._lotId);
            // 클러스터러는 별도 처리: 일단 클러스터러에서 제거
            if (v) m.setMap(state.clusterer ? null : map);  // 클러스터러가 있으면 add로 보여줌
            else m.setMap(null);
          });
          state.chipOverlays.forEach(o => {
            const v = !isFiltered || visSet.has(o._lotId);
            o.setMap(v ? map : null);
          });
          if (state.clusterer) {
            state.clusterer.clear();
            const visMarkers = state.markers.filter(m => !isFiltered || visSet.has(m._lotId));
            // 필터링 적용 시 (visible 수가 적으면) 클러스터러 우회하고 직접 표시
            if (isFiltered && visMarkers.length <= 50) {
              visMarkers.forEach(m => m.setMap(map));
            } else {
              state.clusterer.addMarkers(visMarkers);
            }
          }
        }

        function reverseGeocode(lat, lng, cb) {
          try {
            new kakao.maps.services.Geocoder().coord2Address(lng, lat, (result, status) => {
              if (status === kakao.maps.services.Status.OK && result && result[0]) {
                const road = result[0].road_address?.address_name;
                const jibun = result[0].address?.address_name;
                cb(road || jibun || '현재 위치');
              } else {
                cb('현재 위치');
              }
            });
          } catch (e) {
            cb('현재 위치');
          }
        }

        // ─── 카카오 모빌리티 도로 경로 ───
        const KAKAO_REST_KEY = 'e369007f7234d41ce977746bcd1fb224';
        const routeCache = new Map();
        let routeRequestId = 0;

        async function fetchKakaoRoute(o, d, waypoints) {
          const validWps = (waypoints || []).filter(w => w.lat != null && w.lng != null);
          const wpParam = validWps.length
            ? '&waypoints=' + validWps.map(w => `${w.lng},${w.lat}`).join('|')
            : '';
          const url = `https://apis-navi.kakaomobility.com/v1/directions?origin=${o.lng},${o.lat}&destination=${d.lng},${d.lat}&priority=RECOMMEND${wpParam}`;
          const res = await fetch(url, {
            headers: { Authorization: `KakaoAK ${KAKAO_REST_KEY}` }
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const route = data.routes?.[0];
          if (!route || route.result_code !== 0) throw new Error(route?.result_msg || 'No route');
          const path = [];
          for (const section of route.sections || []) {
            for (const road of section.roads || []) {
              const v = road.vertexes || [];
              for (let i = 0; i < v.length; i += 2) {
                path.push(new kakao.maps.LatLng(v[i + 1], v[i]));
              }
            }
          }
          return {
            path,
            distanceM: route.summary.distance,
            durationS: route.summary.duration,
            taxiFare: route.summary.fare?.taxi || 0,
            tollFare: route.summary.fare?.toll || 0,
          };
        }

        function drawRoute(path, label, midLatLng) {
          state.routePolyline = new kakao.maps.Polyline({
            path,
            strokeWeight: 5,
            strokeColor: '#3182F6',
            strokeOpacity: 0.9,
            strokeStyle: 'solid',
          });
          state.routePolyline.setMap(map);

          state.routeLabel = new kakao.maps.CustomOverlay({
            content: `<div class="route-label">${label}</div>`,
            position: midLatLng,
            yAnchor: 0.5, xAnchor: 0.5,
            zIndex: 60,
          });
          state.routeLabel.setMap(map);

          const bounds = new kakao.maps.LatLngBounds();
          path.forEach(pt => bounds.extend(pt));
          map.setBounds(bounds, 80, 80, 80, 80);

          // 경로 좌표 캐시 (점 너무 많으면 샘플링)
          const step = Math.max(1, Math.floor(path.length / 200));
          const coords = [];
          for (let i = 0; i < path.length; i += step) {
            coords.push([path[i].getLat(), path[i].getLng()]);
          }
          // 마지막 점 보장
          if (coords[coords.length - 1] !== path[path.length - 1]) {
            const last = path[path.length - 1];
            coords.push([last.getLat(), last.getLng()]);
          }
          state.routePathCoords = coords;
          if (state.districtName) renderList(state.districtName);
        }

        async function updateRoute() {
          clearRoute();
          if (!state.origin || !state.destination) return;
          const o = state.origin, d = state.destination;
          const midLatLng = new kakao.maps.LatLng((o.lat + d.lat) / 2, (o.lng + d.lng) / 2);

          // 로딩 라벨 즉시 표시
          state.routeLabel = new kakao.maps.CustomOverlay({
            content: `<div class="route-label"><span class="est">경로 계산 중…</span></div>`,
            position: midLatLng,
            yAnchor: 0.5, xAnchor: 0.5,
            zIndex: 60,
          });
          state.routeLabel.setMap(map);

          const validWps = state.waypoints.filter(w => w.lat != null && w.lng != null);
          const wpKeyPart = validWps.map(w => `${w.lng.toFixed(5)},${w.lat.toFixed(5)}`).join('|');
          const key = `${o.lng.toFixed(5)},${o.lat.toFixed(5)}|${wpKeyPart}|${d.lng.toFixed(5)},${d.lat.toFixed(5)}`;
          const reqId = ++routeRequestId;

          try {
            let route = routeCache.get(key);
            if (!route) {
              route = await fetchKakaoRoute(o, d, validWps);
              routeCache.set(key, route);
            }
            if (reqId !== routeRequestId) return;

            clearRoute();
            const min = Math.max(1, Math.round(route.durationS / 60));
            const label = `<span class="km">${formatDistance(route.distanceM)}</span><span class="est">· 약 ${min}분</span>`;
            drawRoute(route.path, label, midLatLng);
          } catch (e) {
            if (reqId !== routeRequestId) return;
            console.warn('도로 경로 실패, 직선으로 대체:', e.message);
            clearRoute();
            const path = [new kakao.maps.LatLng(o.lat, o.lng), new kakao.maps.LatLng(d.lat, d.lng)];
            const distM = haversineMeters({ lat: o.lat, lng: o.lng }, { lat: d.lat, lng: d.lng });
            const label = `<span class="km">${formatDistance(distM)}</span><span class="est">· 직선거리</span>`;
            // 직선용 점선
            state.routePolyline = new kakao.maps.Polyline({
              path, strokeWeight: 4, strokeColor: '#3182F6', strokeOpacity: 0.7, strokeStyle: 'shortdash',
            });
            state.routePolyline.setMap(map);
            state.routeLabel = new kakao.maps.CustomOverlay({
              content: `<div class="route-label">${label}</div>`,
              position: midLatLng, yAnchor: 0.5, xAnchor: 0.5, zIndex: 60,
            });
            state.routeLabel.setMap(map);
            const bounds = new kakao.maps.LatLngBounds();
            path.forEach(pt => bounds.extend(pt));
            map.setBounds(bounds, 80, 80, 80, 80);
            state.routePathCoords = [[o.lat, o.lng], [d.lat, d.lng]];
            if (state.districtName) renderList(state.districtName);
          }
        }

        function showMapEmpty(district) {
          const div = document.createElement('div');
          div.className = 'map-empty';
          div.innerHTML = `
            <div class="icon">🚧</div>
            <div class="title">${escapeHtml(district.name)} 데이터 준비 중</div>
            <div class="msg">아직 ${escapeHtml(district.name)} 데이터가 추가되지 않았습니다.<br>다른 구를 선택하거나, 추후 업데이트를 기다려주세요.</div>
          `;
          mapContainer.appendChild(div);
          state.mapEmptyEl = div;
        }

        function setActiveItem(lotId) {
          document.querySelectorAll('.list-item').forEach(el => {
            el.classList.toggle('active', el.dataset.lotId === lotId);
          });
        }

        function openCard(lot) {
          if (state.openCardOverlay) state.openCardOverlay.setMap(null);
          const overlay = new kakao.maps.CustomOverlay({
            content: buildCard(lot), position: lot._coords,
            yAnchor: 1.18, zIndex: 100
          });
          overlay.setMap(map);
          state.openCardOverlay = overlay;
          setTimeout(() => {
            const root = document.querySelector('.card-wrap');
            if (!root || root._bound) return;
            root._bound = true;
            root.querySelector('.close')?.addEventListener('click', () => {
              overlay.setMap(null);
              if (state.openCardOverlay === overlay) state.openCardOverlay = null;
            });
            root.querySelector('.set-dest')?.addEventListener('click', (e) => {
              const id = e.currentTarget.dataset.lotId;
              const lot = state.lotById.get(id);
              if (lot) setDestAndAutoOrigin({ name: cleanLotName(lot.name), lat: lot.lat, lng: lot.lng });
              overlay.setMap(null);
              if (state.openCardOverlay === overlay) state.openCardOverlay = null;
            });
            root.querySelector('.card-kakao-nav')?.addEventListener('click', (e) => {
              const id = e.currentTarget.dataset.lotId;
              const lot = state.lotById.get(id);
              if (lot) openKakaoNav({ name: cleanLotName(lot.name), lat: lot.lat, lng: lot.lng });
            });
            root.querySelector('.card-tmap-nav')?.addEventListener('click', (e) => {
              const id = e.currentTarget.dataset.lotId;
              const lot = state.lotById.get(id);
              if (lot) openTmap({ name: cleanLotName(lot.name), lat: lot.lat, lng: lot.lng });
            });
          }, 0);
        }

        function focusLot(lot) {
          if (!lot._coords) return;
          map.panTo(lot._coords);
          setActiveItem(lot._id);
          openCard(lot);
        }

        kakao.maps.event.addListener(map, 'click', () => {
          if (state.openCardOverlay) { state.openCardOverlay.setMap(null); state.openCardOverlay = null; }
        });

        // 지도 칩 클릭 = 상세 카드 (경로는 카드 내 '경로검색' 버튼으로)
        document.addEventListener('click', (e) => {
          const chipWrap = e.target.closest('.chip-wrap');
          if (chipWrap) {
            const lot = state.lotById.get(chipWrap.dataset.lotId);
            if (lot) focusLot(lot);
          }
        });
        // 좌측 리스트 클릭 = 상세 카드 (정보 확인용)
        listEl.addEventListener('click', (e) => {
          const item = e.target.closest('.list-item');
          if (!item) return;
          const lot = state.lotById.get(item.dataset.lotId);
          if (lot) focusLot(lot);
        });
        // 좌측 리스트 호버 = 지도 이동 + 적당히 확대 (디바운스 200ms)
        let hoverTimer = null;
        listEl.addEventListener('mouseover', (e) => {
          const item = e.target.closest('.list-item');
          if (!item) return;
          if (hoverTimer) clearTimeout(hoverTimer);
          hoverTimer = setTimeout(() => {
            const lot = state.lotById.get(item.dataset.lotId);
            if (!lot || !lot._coords) return;
            map.panTo(lot._coords);
            if (map.getLevel() > 4) map.setLevel(4, { anchor: lot._coords });
          }, 200);
        });
        listEl.addEventListener('mouseout', (e) => {
          // 다른 항목으로 빠르게 옮길 때 타이머 취소
          if (e.target.closest('.list-item') && !e.relatedTarget?.closest('.list-item')) {
            if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
          }
        });

        // ─── 거리 / 정렬 / 리스트 ───
        function renderList(districtName) {
          state.districtName = districtName;
          let lots = state.lots.slice();
          let mode = 'default';

          const hasRoute = state.routePathCoords && state.routePathCoords.length >= 2;
          const ROUTE_RADIUS_M = 1000;

          if (hasRoute && state.origin && state.destination) {
            // 경로상 1km 이내 + 도착지 기준 거리순
            const dest = state.destination;
            lots.forEach(l => {
              l._distToPath = minDistMToPath(l.lat, l.lng, state.routePathCoords);
              l._distance = haversineMeters({ lat: l.lat, lng: l.lng }, dest);
            });
            lots = lots.filter(l => l._distToPath <= ROUTE_RADIUS_M);
            lots.sort((a, b) => a._distance - b._distance);
            mode = 'route';
          } else if (state.destination) {
            const dest = state.destination;
            lots.forEach(l => { l._distance = haversineMeters({ lat: l.lat, lng: l.lng }, dest); l._distToPath = null; });
            lots.sort((a, b) => a._distance - b._distance);
            mode = 'destination';
          } else {
            lots.forEach(l => { l._distance = null; l._distToPath = null; });
          }

          // 지도 마커도 같은 필터 적용
          applyMapVisibility(mode === 'route' ? lots.map(l => l._id) : null);

          // 헤더 표시
          if (mode === 'route') {
            listCountEl.textContent = `경로상 ${lots.length}곳 (1km 이내)`;
            sortLabelEl.textContent = '도착지 가까운 순';
            sortLabelEl.style.display = '';
          } else if (mode === 'destination') {
            listCountEl.textContent = `주차장 ${lots.length}곳`;
            sortLabelEl.textContent = '도착지 가까운 순';
            sortLabelEl.style.display = '';
          } else {
            listCountEl.textContent = `주차장 ${lots.length}곳`;
            sortLabelEl.style.display = 'none';
          }

          listEl.innerHTML = lots.length
            ? lots.map(l => buildListItem(l, districtName)).join('')
            : '<div class="list-empty">' + (mode === 'route' ? '경로 1km 내 주차장이 없어요.' : '표시할 주차장이 없어요.') + '</div>';
        }

        // ─── 자동완성 (카카오 Places) ───
        const placesService = new kakao.maps.services.Places();

        function setupAutocomplete(inputEl, dropdownEl, rowEl, onPick) {
          const fire = debounce((q) => {
            if (!q || q.length < 2) { dropdownEl.classList.remove('show'); return; }
            // 1차: 지도 중심에서 20km 내 정확도순 검색
            placesService.keywordSearch(q, (data, status) => {
              if (status === kakao.maps.services.Status.OK && data.length > 0) {
                showResults(data);
                return;
              }
              // 2차: 범위 제거하고 전국 검색
              placesService.keywordSearch(q, (data2, status2) => {
                if (status2 !== kakao.maps.services.Status.OK || data2.length === 0) {
                  dropdownEl.innerHTML = '<div class="ac-empty">검색 결과 없음</div>';
                  dropdownEl.classList.add('show');
                  return;
                }
                showResults(data2);
              });
            }, { location: map.getCenter(), radius: 20000, sort: 'accuracy' });

            function showResults(data) {
              const items = data.slice(0, 8);
              dropdownEl.innerHTML = items.map((p, i) => `
                <div class="ac-item" data-i="${i}">
                  <div class="ac-name">${escapeHtml(p.place_name)}</div>
                  <div class="ac-addr">${escapeHtml(p.road_address_name || p.address_name || '')}</div>
                </div>
              `).join('');
              dropdownEl.classList.add('show');
              dropdownEl._items = items;
            }
          }, 220);

          inputEl.addEventListener('input', (e) => {
            rowEl.classList.toggle('has-value', !!e.target.value);
            fire(e.target.value.trim());
          });
          inputEl.addEventListener('focus', (e) => {
            if (e.target.value.trim().length >= 2) fire(e.target.value.trim());
          });
          inputEl.addEventListener('blur', () => {
            setTimeout(() => dropdownEl.classList.remove('show'), 150);
          });
          dropdownEl.addEventListener('mousedown', (e) => {
            const item = e.target.closest('.ac-item');
            if (!item) return;
            e.preventDefault();
            const p = dropdownEl._items?.[+item.dataset.i];
            if (!p) return;
            inputEl.value = p.place_name;
            rowEl.classList.add('has-value');
            dropdownEl.classList.remove('show');
            onPick({ name: p.place_name, lat: parseFloat(p.y), lng: parseFloat(p.x) });
          });
        }

        function setOrigin(p) {
          if (state.origin?.overlay) state.origin.overlay.setMap(null);
          if (!p) { state.origin = null; updateNavButtons(); updateRoute(); if (state.districtName) renderList(state.districtName); return; }
          const overlay = new kakao.maps.CustomOverlay({
            content: makeEndpointMarkerContent('origin', '출발 · ' + p.name),
            position: new kakao.maps.LatLng(p.lat, p.lng),
            yAnchor: 1.5, zIndex: 50
          });
          overlay.setMap(map);
          state.origin = { ...p, overlay };
          document.getElementById('originInput').value = p.name;
          document.getElementById('originRow').classList.add('has-value');
          updateNavButtons();
          updateRoute();
          if (state.districtName) renderList(state.districtName);
        }

        function setDestination(p) {
          if (state.destination?.overlay) state.destination.overlay.setMap(null);
          if (!p) {
            state.destination = null;
            const dist = districtByCode.get(state.districtCode);
            renderList(dist?.name || '');
            updateNavButtons();
            updateRoute();
            return;
          }
          const overlay = new kakao.maps.CustomOverlay({
            content: makeEndpointMarkerContent('dest', '도착 · ' + p.name),
            position: new kakao.maps.LatLng(p.lat, p.lng),
            yAnchor: 1.5, zIndex: 50
          });
          overlay.setMap(map);
          state.destination = { ...p, overlay };
          document.getElementById('destInput').value = p.name;
          document.getElementById('destRow').classList.add('has-value');
          const dist = districtByCode.get(state.districtCode);
          renderList(dist?.name || '');
          updateNavButtons();
          updateRoute();
          // 경로가 양쪽 모두 있으면 bounds로 조정 (updateRoute가 처리); 도착지만 있으면 그 위치로 이동
          if (!state.origin) map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
        }

        // ─── 경유지 ───
        function refreshAddWpButton() {
          const btn = document.getElementById('addWpBtn');
          if (btn) btn.disabled = state.waypoints.length >= MAX_WAYPOINTS;
        }

        function addWaypoint() {
          if (state.waypoints.length >= MAX_WAYPOINTS) return;
          const wpId = 'wp-' + Date.now() + '-' + state.waypoints.length;
          const row = document.createElement('div');
          row.className = 'search-row waypoint';
          row.dataset.wpId = wpId;
          row.innerHTML = `
            <span class="icon">●</span>
            <input class="wp-input" type="text" placeholder="경유지를 입력하세요" autocomplete="off">
            <button class="btn-clear wp-remove" type="button" aria-label="경유지 삭제" style="display:flex">×</button>
            <div class="ac-dropdown"></div>
          `;
          document.getElementById('waypointsContainer').appendChild(row);
          const wp = { id: wpId, name: null, lat: null, lng: null, overlay: null, row };
          state.waypoints.push(wp);
          refreshAddWpButton();

          const inputEl = row.querySelector('.wp-input');
          const dropdownEl = row.querySelector('.ac-dropdown');
          setupAutocomplete(inputEl, dropdownEl, row, (p) => setWaypoint(wpId, p));
          row.querySelector('.wp-remove').addEventListener('click', () => removeWaypoint(wpId));
          setTimeout(() => inputEl.focus(), 0);
        }

        function setWaypoint(wpId, p) {
          const wp = state.waypoints.find(w => w.id === wpId);
          if (!wp) return;
          if (wp.overlay) wp.overlay.setMap(null);
          Object.assign(wp, p);
          const overlay = new kakao.maps.CustomOverlay({
            content: makeEndpointMarkerContent('waypoint', '경유 · ' + p.name),
            position: new kakao.maps.LatLng(p.lat, p.lng),
            yAnchor: 1.5, zIndex: 50
          });
          overlay.setMap(map);
          wp.overlay = overlay;
          updateRoute();
        }

        function removeWaypoint(wpId) {
          const idx = state.waypoints.findIndex(w => w.id === wpId);
          if (idx < 0) return;
          const wp = state.waypoints[idx];
          if (wp.overlay) wp.overlay.setMap(null);
          wp.row.remove();
          state.waypoints.splice(idx, 1);
          refreshAddWpButton();
          updateRoute();
        }

        document.getElementById('addWpBtn').addEventListener('click', addWaypoint);

        setupAutocomplete(
          document.getElementById('originInput'),
          document.getElementById('originAc'),
          document.getElementById('originRow'),
          setOrigin
        );
        setupAutocomplete(
          document.getElementById('destInput'),
          document.getElementById('destAc'),
          document.getElementById('destRow'),
          setDestination
        );

        document.getElementById('originClear').addEventListener('click', () => {
          document.getElementById('originInput').value = '';
          document.getElementById('originRow').classList.remove('has-value');
          setOrigin(null);
        });
        document.getElementById('destClear').addEventListener('click', () => {
          document.getElementById('destInput').value = '';
          document.getElementById('destRow').classList.remove('has-value');
          setDestination(null);
        });

        // ─── 현재 위치 ───
        document.getElementById('useCurrentBtn').addEventListener('click', () => {
          if (!navigator.geolocation) { alert('이 브라우저는 위치 기능을 지원하지 않습니다.'); return; }
          const btn = document.getElementById('useCurrentBtn');
          btn.textContent = '확인 중…'; btn.disabled = true;
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              btn.textContent = '현재 위치'; btn.disabled = false;
              const lat = pos.coords.latitude, lng = pos.coords.longitude;
              reverseGeocode(lat, lng, (name) => setOrigin({ name, lat, lng }));
            },
            (err) => {
              btn.textContent = '현재 위치'; btn.disabled = false;
              alert('위치를 가져올 수 없습니다: ' + err.message);
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        });

        // ─── 내비 ───
        function updateNavButtons() {
          const has = !!state.destination;  // 출발지는 선택, 도착지만 필수
          document.getElementById('kakaoNavBtn').disabled = !has;
          document.getElementById('tmapNavBtn').disabled = !has;
        }

        function getValidWaypoints() {
          return state.waypoints.filter(w => w.lat != null && w.lng != null);
        }

        function setDestAndAutoOrigin(p) {
          setDestination(p);
          if (state.origin || !navigator.geolocation) return;
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              if (state.destination && state.destination.lat === p.lat && state.destination.lng === p.lng) {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                reverseGeocode(lat, lng, (name) => setOrigin({ name, lat, lng }));
              }
            },
            () => {},
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
          );
        }

        function openKakaoNav(destOverride) {
          const dest = destOverride || state.destination;
          const org = state.origin;
          const wps = destOverride ? [] : getValidWaypoints();
          if (!dest) return;
          if (isMobile()) {
            if (wps.length > 0 && org) {
              // 경유지 있을 때는 카카오맵 route scheme (vp 파라미터 지원)
              const vp = wps.map(w => `${encodeURIComponent(w.name)},${w.lat},${w.lng}`).join('|');
              const url = `kakaomap://route?sp=${org.lat},${org.lng}&ep=${dest.lat},${dest.lng}&vp=${vp}&by=CAR`;
              window.location.href = url;
            } else {
              // 경유지 없으면 카카오내비
              const url = `kakaonavi://navigate?name=${encodeURIComponent(dest.name)}&x=${dest.lng}&y=${dest.lat}&coord_type=wgs84`;
              window.location.href = url;
              setTimeout(() => {
                window.open(`https://map.kakao.com/?eName=${encodeURIComponent(dest.name)}`, '_blank');
              }, 1500);
            }
          } else {
            // PC: 카카오맵 길찾기 (경유지 미지원)
            const params = new URLSearchParams();
            if (org) params.set('sName', org.name);
            params.set('eName', dest.name);
            window.open(`https://map.kakao.com/?${params.toString()}`, '_blank');
            if (wps.length > 0) {
              setTimeout(() => alert('PC 카카오맵 길찾기는 경유지를 지원하지 않습니다. 모바일에서 이용해주세요.'), 100);
            }
          }
        }

        function openTmap(destOverride) {
          const dest = destOverride || state.destination;
          const org = state.origin;
          const wps = destOverride ? [] : getValidWaypoints();
          if (!dest) return;
          if (isMobile()) {
            let url = `tmap://route?goalname=${encodeURIComponent(dest.name)}&goalx=${dest.lng}&goaly=${dest.lat}`;
            if (org) url += `&startname=${encodeURIComponent(org.name)}&startx=${org.lng}&starty=${org.lat}`;
            wps.slice(0, 3).forEach((w, i) => {
              const n = i + 1;
              url += `&via${n}name=${encodeURIComponent(w.name)}&via${n}x=${w.lng}&via${n}y=${w.lat}`;
            });
            window.location.href = url;
          } else {
            alert('티맵은 모바일 앱 전용입니다. 휴대폰으로 접속해서 이용해주세요.');
          }
        }

        document.getElementById('kakaoNavBtn').addEventListener('click', openKakaoNav);
        document.getElementById('tmapNavBtn').addEventListener('click', openTmap);

        // ─── 구별 데이터 로드 ───
        async function loadDistrict(code) {
          clearState();
          state.districtCode = code;
          selectEl.value = code;
          history.replaceState(null, '', '#' + code);

          const district = districtByCode.get(code);
          if (!district) { statusEl.textContent = '알 수 없는 구'; return; }

          subEl.textContent = `${district.operator || district.name + ' 시설관리공단'}`;
          updatedAtEl.textContent = '-';
          listEl.innerHTML = '<div class="list-empty">데이터를 불러오는 중…</div>';
          statusEl.textContent = '데이터를 불러오는 중…';
          statusEl.style.display = '';

          if (!district.active) {
            statusEl.style.display = 'none';
            subEl.textContent = '데이터 준비 중';
            listEl.innerHTML = `<div class="list-empty">${escapeHtml(district.name)} 데이터는<br>아직 준비되지 않았어요.</div>`;
            listCountEl.textContent = '주차장 0곳';
            sortLabelEl.style.display = 'none';
            showMapEmpty(district);
            return;
          }

          const cat = state.category;
          const t = Date.now();
          const wantPublic = cat === 'public' || cat === 'all';
          const wantResidential = cat === 'residential' || cat === 'all';

          let publicData = null, residentialData = null, realtime = null;
          try {
            if (district.aggregate) {
              // 서울 전체: 모든 active 구의 lots 합치기
              const codes = districts.filter(d => d.active && !d.aggregate).map(d => d.code);
              const safeFetch = (url) => fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
              if (wantPublic) {
                const arr = await Promise.all(codes.map(c => safeFetch(`./data/lots/${c}.json?_=${t}`)));
                publicData = { lots: arr.flatMap(d => d?.lots || []), operator: '서울특별시' };
                realtime = await safeFetch(`./data/realtime.json?_=${t}`);
              }
              if (wantResidential) {
                const arr = await Promise.all(codes.map(c => safeFetch(`./data/residential/${c}.json?_=${t}`)));
                residentialData = { lots: arr.flatMap(d => d?.lots || []) };
              }
            } else {
              const fetches = [];
              if (wantPublic) {
                fetches.push(fetch(`./data/lots/${code}.json?_=${t}`));
                fetches.push(fetch(`./data/realtime.json?_=${t}`).catch(() => null));
              }
              if (wantResidential) {
                fetches.push(fetch(`./data/residential/${code}.json?_=${t}`).catch(() => null));
              }
              const results = await Promise.all(fetches);
              let idx = 0;
              if (wantPublic) {
                const pRes = results[idx++];
                if (!pRes.ok) throw new Error('public HTTP ' + pRes.status);
                publicData = await pRes.json();
                const rRes = results[idx++];
                if (rRes && rRes.ok) { try { realtime = await rRes.json(); } catch {} }
              }
              if (wantResidential) {
                const rsRes = results[idx++];
                if (rsRes && rsRes.ok) { try { residentialData = await rsRes.json(); } catch {} }
              }
            }
          } catch (e) {
            statusEl.textContent = `데이터 로드 실패: ${e.message}`;
            return;
          }

          const realtimeLots = realtime?.lots || {};
          const allRaw = [
            ...(publicData?.lots || []),
            ...(residentialData?.lots || []),
          ];
          const visibleLots = allRaw
            .filter(l => l.hourlyAvailable)
            .map((l, i) => {
              const rt = l.realtimeKey ? realtimeLots[l.realtimeKey] : null;
              return {
                ...l,
                _id: `${code}-${cat}-${i}`,
                availableSpaces: rt ? rt.available : null,
                realtimeUpdatedAt: rt ? rt.updatedAt : null,
              };
            });
          // 전체 모드용 dataset 객체 (subtitle용)
          const dataset = publicData || residentialData;

          const catLabel = cat === 'residential' ? '거주자우선주차'
            : cat === 'all' ? '전체 주차장'
            : '시간주차 가능';
          subEl.innerHTML = `${catLabel} <b>${visibleLots.length}</b>곳 · ${escapeHtml(publicData?.operator || dataset?.source || district.operator || '')}`;
          updatedAtEl.textContent = dataset?.updatedAt || '-';

          const publicMarkerImg = makeMarkerImage('public');
          const residentialMarkerImg = makeMarkerImage('residential');
          // 위경도가 데이터에 있으면 지오코딩 스킵
          const lookups = visibleLots.map(lot => {
            if (lot.lat != null && lot.lng != null) {
              return Promise.resolve(lot);
            }
            return new Promise(resolve => {
              new kakao.maps.services.Geocoder().addressSearch(lot.address, (result, status) => {
                if (status === kakao.maps.services.Status.OK) {
                  resolve({ ...lot, lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
                } else {
                  console.warn('주소 변환 실패:', lot.name, lot.address);
                  resolve(null);
                }
              });
            });
          });

          const results = await Promise.all(lookups);
          if (state.districtCode !== code || state.category !== cat) return;

          const valid = results.filter(r => r !== null);
          const bounds = new kakao.maps.LatLngBounds();
          const useClusterer = valid.length > 80;
          const showChips = valid.length <= 50;

          if (useClusterer) {
            state.clusterer = new kakao.maps.MarkerClusterer({
              map, averageCenter: true, minLevel: 4,
              styles: [{
                width: '36px', height: '36px',
                background: '#10B981', color: 'white',
                borderRadius: '50%', textAlign: 'center',
                lineHeight: '36px', fontWeight: '700', fontSize: '13px',
                border: '2px solid white',
                boxShadow: '0 2px 8px rgba(16,185,129,0.4)',
              }],
            });
          }

          const clusteredMarkers = [];
          valid.forEach(lot => {
            lot._coords = new kakao.maps.LatLng(lot.lat, lot.lng);
            state.lotById.set(lot._id, lot);
            state.lots.push(lot);

            const isResi = lot.category === 'residential';
            const marker = new kakao.maps.Marker({
              position: lot._coords, title: lot.name,
              image: isResi ? residentialMarkerImg : publicMarkerImg
            });
            // 대량(>80)이면 클러스터러로, 적으면 개별 표시
            if (useClusterer) {
              clusteredMarkers.push(marker);
            } else {
              marker.setMap(map);
            }
            kakao.maps.event.addListener(marker, 'click', () => focusLot(lot));

            // 칩은 공영(public)이면서 데이터가 적을 때만
            marker._lotId = lot._id;
            if (!isResi && showChips) {
              const chipOverlay = new kakao.maps.CustomOverlay({
                content: buildChip(lot), position: lot._coords,
                yAnchor: 2.6, zIndex: 3
              });
              chipOverlay.setMap(map);
              chipOverlay._lotId = lot._id;
              state.chipOverlays.push(chipOverlay);
            }

            state.markers.push(marker);
            bounds.extend(lot._coords);
          });

          if (useClusterer && clusteredMarkers.length) state.clusterer.addMarkers(clusteredMarkers);
          if (valid.length > 0) map.setBounds(bounds);
          renderList(district.name);

          if (valid.length < visibleLots.length) {
            statusEl.textContent = `${valid.length}/${visibleLots.length}곳 표시 (일부 주소 변환 실패)`;
            setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
          } else {
            statusEl.style.display = 'none';
          }
        }

        selectEl.addEventListener('change', e => loadDistrict(e.target.value));
        document.getElementById('categorySelect').addEventListener('change', e => {
          state.category = e.target.value;
          loadDistrict(state.districtCode || initialCode);
        });
        window.addEventListener('hashchange', () => {
          const code = location.hash.replace('#', '');
          if (code && districtByCode.has(code) && code !== state.districtCode) loadDistrict(code);
        });

        loadDistrict(initialCode);

        // URL hash가 없으면 권한 받아 현재 위치의 구로 자동 전환
        if (!hashCode && navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            new kakao.maps.services.Geocoder().coord2Address(pos.coords.longitude, pos.coords.latitude, (result, status) => {
              if (status !== kakao.maps.services.Status.OK || !result?.[0]) return;
              const guName = result[0].address?.region_2depth_name;
              const found = districts.find(d => d.name === guName);
              if (found && found.code !== state.districtCode) {
                loadDistrict(found.code);
              }
            });
          }, () => {}, { timeout: 10000, maximumAge: 300000 });
        }
      });
    })();
  </script>
</body>
</html>
